# values.yaml
edition: community

jdbcOverwrite:
  enable: true
  jdbcUrl: "jdbc:postgresql://<YOUR_CLOUD_SQL_PRIVATE_IP>:5432/sonar"
  jdbcUsername: "sonar"
  jdbcPassword: "your-password"

# Autopilot requires explicit resource requests
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# Use an Internal Load Balancer for your backend to connect
service:
  type: LoadBalancer
  annotations:
    networking.gke.io/load-balancer-type: "Internal"

postgres:
  image: "postgres:16-alpine"
  postgresUser: "sonar"
  postgresDB: "sonar"
  postgresPassword: "sonar"
  storageSize: 1Gi
  serviceName: "postgres-sonar-service"
  port: 5432

redis:
  image: "redis:7-alpine"
  storageSize: 500Mi
  serviceName: "redis-service"
  port: 6379

config:
  nodeEnv: "production"
  logLevel: "info"
  apiGatewayHost: "api-gateway-service"
  apiGatewayPort: "8080"
  frontendUrl: "https://devops-hub.your-domain.example.com"
  sessionExpiryHours: 24
  corsOrigins: "https://devops-hub.your-domain.example.com"

  
