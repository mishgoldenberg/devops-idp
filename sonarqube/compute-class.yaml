apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: sonarqube-node-config
spec:
  nodePoolAutoCreation:
    enabled: true
  # 'whenUnsatisfiable' ensures we don't accidentally deploy to a non-compliant node
  whenUnsatisfiable: "DoNotScaleUp"
  priorityDefaults:
    nodeSystemConfig:
      linuxNodeConfig:
        sysctls:
          # REMOVE QUOTES: Must be an integer
          vm.max_map_count: 262144
  # Autopilot needs at least one priority rule to know what machines to build
  priorities:
    - machineFamily: e2  # Standard cost-effective machines