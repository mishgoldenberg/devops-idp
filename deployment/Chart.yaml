apiVersion: v2
name: devops-control-center
description: Umbrella chart for the DevOps IDP stack
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # External Infrastructure
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  # Internal Services (Local Sub-charts)
  - name: frontend
    version: "0.1.0"
    repository: "file://charts/frontend"
  - name: backend
    version: "0.1.0"
    repository: "file://charts/backend"