apiVersion: v2
name: devops-control-center-prod
description: Air-gapped Umbrella chart for the DevOps IDP stack
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # Infrastructure (Now local)
  - name: infrastructure
    version: "0.1.0"
    repository: "file://./charts/infrastructure"

  # Internal Services (Local Sub-charts)
  - name: frontend
    version: "0.1.0"
    repository: "file://./charts/frontend"

  # Internal Services (Local Sub-charts)
  - name: backend
    version: "0.1.0"
    repository: "file://./charts/backend"

  - name: ingress-nginx
    version: "4.x.x"
    repository: "file://./charts/ingress-nginx"
    alias: ingress-prod # You can alias it for the specific environment