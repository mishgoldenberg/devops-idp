# Global Helm values for the devops-stack umbrella chart.
postgres:
  enabled: true
  primary:
    service:
      ports:
        postgres: 5432
      type: ClusterIP
  postgresUser: "devops"
  postgresDB: "devops_control_center"
  storageSize: 1Gi
  secretName: "all-secrets"
  serviceName: "postgres-service"

redis:
  enabled: true
  master:
    service:
      ports:
        redis: 6379
      type: ClusterIP
  serviceName: "redis-service"

# --- REFACTORED GLOBAL BLOCK (Added for cross-chart communication) ---
global:
  # This makes your image repo available to everyone
  customImage:
    repository: "your-registry.example.com/your-org/devops-hub"
    pullPolicy: "Always"
  replicaCount: 1

  # How many database dumps are kept in Artifactory. A GLOBAL because two charts
  # need the same number: the infrastructure chart passes it to the backup job that
  # does the pruning, and the backend chart passes it to the portal, which uses it to
  # say which of the recorded backups are still restorable and which have aged out.
  # A second copy would drift, and the drift shows up as the portal offering a
  # restore point that Artifactory deleted days ago.
  backupKeepLast: 3

  # Suffix appended to EVERY resource name and `app` label in all three charts.
  # "" for production, "-test" for test. This is what lets both stacks live in one
  # namespace: without it the second release would overwrite the first's Deployments
  # and, worse, its Services would select the first's pods — sending test traffic
  # into production with nothing on screen to indicate it.
  nameSuffix: ""

  # See the comment in the Deployment templates: Kubernetes keeps 10 old ReplicaSets
  # per Deployment by default, which is where the long list of "0 of 0 pods" entries
  # comes from. They are rollback history, not stray pods.
  revisionHistoryLimit: 2

  # Set to "false" where integrations (Azure DevOps,
  # Artifactory, SonarQube, ServiceNow, SSO) use internal/self-signed certs.
  integrationTlsVerify: "true"

  # True capacity of the disk Artifactory stores its binaries on, e.g. "6 TB".
  # Artifactory only reports the mount its data dir is on, which here is a small
  # partition, so the storage widget cannot derive a real total by itself. Leave
  # empty to have the widget report the capacity as unknown rather than guess.
  # Overridden per-environment from the pipeline (ARTIFACTORY_DISK_TOTAL).
  artifactoryDiskTotal: ""

  # DevBot, the chat assistant. The AI model gateway's OpenAI-compatible base URL
  # (ending in /v1) switches it on; empty leaves the DevBot page saying it is not set
  # up. The default model is used when a person's key may use it. The help URL is where
  # people create their own model key, linked from the key guide. All three come from
  # the pipeline (DEVBOT_LLM_BASE_URL, DEVBOT_DEFAULT_MODEL, DEVBOT_KEY_HELP_URL).
  devbotLlmBaseUrl: ""
  devbotDefaultModel: ""
  devbotKeyHelpUrl: ""
  # "false" only if scripts/check_llm_endpoint.py reports "stream FAIL" for the models:
  # answers then arrive whole instead of as they are written.
  devbotStream: "true"

  # This makes DB connection details available to backend/frontend
  endpoints:
    postgresHost: "postgres-service"
    postgresPort: 5432
    postgresUser: "devops"
    postgresDB: "devops_control_center"
    databaseUrl: "postgresql://devops:$(POSTGRES_PASSWORD)@postgres-service:5432/devops_control_center"
    redisHost: "redis-service"
    redisPort: 6379


ingress-prod:
  controller:
    ingressClassResource:
      name: nginx-prod
    scope:
      enabled: true
      namespace: devops-control-center-prod
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    # Disabled: the admission webhook runs a Job on every Helm upgrade which
    # triggers GKE Autopilot node provisioning and stalls deploys for 10+ min.
    # Not needed for an internal cluster where Ingress resources are controlled.
    admissionWebhooks:
      enabled: false
      # Correct key names (createSecretJob / patchWebhookJob) for re-enabling:
      createSecretJob:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
      patchWebhookJob:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

# Infrastructure subchart (Postgres / Redis).
infrastructure:
  postgres:
    observabilityMigrateHook: false
    observabilityMigrateAsyncJob: true