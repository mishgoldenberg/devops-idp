apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: {{ .Values.postgres.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          resources:
            requests:
              cpu: "250m"    # 0.25 CPU
              memory: "512Mi" # 512 MB
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: all-secrets
          env:
            - name: POSTGRES_USER
              value: {{ .Values.global.endpoints.postgresUser }}
            - name: POSTGRES_DB
              value: {{ .Values.global.endpoints.postgresDB }}
            - name: POSTGRES_PORT
              value: {{ .Values.global.endpoints.postgresPort | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.global.endpoints.postgresServiceName }}
            # String interpolation for DATABASE_URL
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/pgdata
            - name: postgres-init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init-scripts
          configMap: { name: postgres-init-scripts }
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}