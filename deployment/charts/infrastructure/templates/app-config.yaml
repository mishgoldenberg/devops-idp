apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # ============================================
  # GENERAL APPLICATION SETTINGS
  # ============================================
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  # ============================================
  # API GATEWAY & FRONTEND URLS
  # ============================================

  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}