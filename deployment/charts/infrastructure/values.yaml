postgres:
  image: "postgres:16-alpine"
  postgresUser: "devops"
  postgresDB: "devops_control_center"
  storageSize: 1Gi
  secretName: "all-secrets"
  serviceName: "postgres-service"
  port: 5432

redis:
  image: "redis:7-alpine"
  storageSize: 500Mi
  serviceName: "redis-service"
  port: 6379

config:
  nodeEnv: "production"
  logLevel: "info"
  apiGatewayHost: "api-gateway-service"
  apiGatewayPort: "8080"
  frontendUrl: "https://devops.internal.company"
  sessionExpiryHours: 24
  corsOrigins: "https://devops.internal.company"

  
