postgres:
  image: "postgres:16-alpine"
  postgresUser: "devops"
  postgresDB: "devops_control_center"
  storageSize: 1Gi
  secretName: "all-secrets"
  serviceName: "postgres-service"
  port: 5432
  # Helm hook Job (post-upgrade): applies 06_observability.sql. Default off — it can fail with
  # DeadlineExceeded on GKE Autopilot if the Job cannot reach postgres-service during the hook.
  # Rely on app startup DDL (ensure_tables) or run 06_observability.sql manually once. Set true only
  # after verifying connectivity from an ephemeral pod in the release namespace.
  observabilityMigrateHook: false

redis:
  image: "redis:7-alpine"
  storageSize: 500Mi
  serviceName: "redis-service"
  port: 6379

config:
  nodeEnv: "production"
  logLevel: "info"
  apiGatewayHost: "api-gateway-service"
  apiGatewayPort: "8080"
  frontendUrl: "https://devops.internal.company"
  sessionExpiryHours: 24
  corsOrigins: "https://devops.internal.company"

  
