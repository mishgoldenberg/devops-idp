
image:
  tag: latest

# External Service URLs (Easy to update as you split microservices!)
services:
  auth: http://auth-service:8001
  azureDevops: http://azure-devops-service:8002
  sonarqube: http://sonarqube-service:8003
  artifactory: http://artifactory-service:8004
  servicenow: http://servicenow-service:8005
  approval: http://approval-service:8007

# Azure DevOps Config
azureDevopsConfig:
  configMapName: azure-devops-config

# Raised from 500m/512Mi. The old limit was half a core for the whole portal; the
# backend renders every page and every widget fragment, so CPU is the binding
# constraint, not memory. Requests stay modest so pods still schedule easily.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

# How a new version replaces the old one. The default here suits a SINGLE replica
# (test): bring the new pod up, wait for readiness, then retire the old one — no
# gap in service, at the cost of one extra pod's worth of quota for the duration.
#
# That extra pod is the catch. In a namespace with a ResourceQuota, `maxSurge: 1`
# means a rollout REQUIRES headroom for one more backend, and if the quota cannot
# fit it the ReplicaSet cannot even create the pod: the Deployment reports
# `ReplicaFailure: FailedCreate`, the old pods serve on indefinitely, and it looks
# identical to "the deploy never happened". Prod overrides this — see
# deployment/values-prod.yaml.
strategy:
  maxUnavailable: 0
  maxSurge: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

tier: backend

terraformServiceAccountAnnotations: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  postgresPassword: ""
  redisPassword: ""
  azureDevopsAdminPat: ""
  jwtSecret: ""
  hubAdminUsername: ""
  hubAdminPassword: ""
  # Optional second local account, always a regular user. Empty = not created.
  hubUserUsername: ""
  hubUserPassword: ""
  snowBaseUrl: ""
  snowApiUsername: ""
  snowApiPassword: ""
  azureDevopsBaseUrl: ""
  artifactoryBaseUrl: ""
  sonarqubeBaseUrl: ""
  confluenceBaseUrl: ""

ingress:
  enabled: true
  className: openshift-default
  host: devops-hub.your-domain.example.com
  # Extra names for the SAME Routes. Must match frontend.ingress.aliasHosts: the
  # page comes from `/` and then calls `/api` on the same origin, so a name only
  # one of them answers to gives a portal that renders and then 503s everything.
  aliasHosts: []
  path: /api
  # OFF by default and opt-in, exactly like the frontend. It was `true` here while
  # the template had no tls block at all, so it meant nothing; making it false and
  # meaningful is the honest direction. The pipeline turns it on from the presence
  # of HUB_TLS_SECRET.
  tls: false
  # The same secret as frontend.ingress.tlsSecretName - one certificate covers the
  # hostname, and both Routes serve that one hostname.
  tlsSecretName: ""
  annotations:
    route.openshift.io/termination: "edge"
    # Redirect, not Allow, to match the frontend. Allow left /api answering on plain
    # HTTP indefinitely, so anything that reached it over http - a stale bookmark, a
    # script - sent its auth cookie in clear.
    route.openshift.io/insecure-edge-termination-policy: "Redirect"