apiVersion: v1
kind: Secret
metadata:
  name: all-secrets{{ .Values.global.nameSuffix }}
type: Opaque
stringData:
  # These two are `required`, not `default ""`, on purpose — it is the second
  # independent layer against shipping a blank Secret, and the one that holds even
  # if the pipeline hands the chart an empty value.
  #
  # An empty POSTGRES_PASSWORD is not a degraded deploy, it is a stack that cannot
  # start: every NEW pod fails to connect with `fe_sendauth: no password supplied`
  # while the running pods carry on from the environment they already hold, so the
  # break is invisible until something restarts.
  #
  # An empty JWT_SECRET is worse and quieter. It signs the session cookie AND
  # derives the key that encrypts every stored Azure DevOps PAT, so a blank one
  # invalidates every session and makes every stored credential undecryptable —
  # the data is not destroyed, but nothing reads it until the real secret is back.
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is empty. Deploying this would write a blank database password into all-secrets and every pod that starts afterwards would fail to connect. Check the `env:` block on the 'Deploy with Helm' step: Azure DevOps does not export secret variables automatically." .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is empty. It signs sessions AND derives the key that encrypts every stored Azure DevOps PAT; a blank one logs everybody out and makes stored credentials unreadable. Check the `env:` block on the 'Deploy with Helm' step." .Values.secrets.jwtSecret | quote }}
  HUB_ADMIN_USERNAME: {{ .Values.secrets.hubAdminUsername | default "" | quote }}
  HUB_ADMIN_PASSWORD: {{ .Values.secrets.hubAdminPassword | default "" | quote }}
  # Optional second LOCAL account, always a regular user (never Platform Admin). Empty
  # means the account is not created at all — no second credential to attack.
  HUB_USER_USERNAME: {{ .Values.secrets.hubUserUsername | default "" | quote }}
  HUB_USER_PASSWORD: {{ .Values.secrets.hubUserPassword | default "" | quote }}
  AZURE_DEVOPS_BASE_URL: {{ .Values.secrets.azureDevopsBaseUrl | default "" | quote }}
  AZURE_DEVOPS_ADMIN_PAT: {{ .Values.secrets.azureDevopsAdminPat | default "" | quote }}
  # NetBIOS domain used to build DOMAIN\user for provisioning grants. Not secret,
  # but travels with the other ADO settings so an operator sets it in one place.
  ADO_NETBIOS_DOMAIN: {{ .Values.secrets.adoNetbiosDomain | default "" | quote }}
  SNOW_BASE_URL: {{ .Values.secrets.snowBaseUrl | default "" | quote }}
  SNOW_API_USERNAME: {{ .Values.secrets.snowApiUsername | default "" | quote }}
  SNOW_API_PASSWORD: {{ .Values.secrets.snowApiPassword | default "" | quote }}
  ARTIFACTORY_BASE_URL: {{ .Values.secrets.artifactoryBaseUrl | default "" | quote }}
  # Credentials the backup CronJobs use to PUT dumps into the Artifactory generic
  # repository. Separate from the Docker pull credentials and from the read-only
  # account the portal's Artifactory widgets use: this one can WRITE, and the two
  # should not be the same principal. Empty means backups are switched off — the
  # pipeline decides `infrastructure.postgres.backup.enabled` from exactly this,
  # so there is no state where a CronJob exists without a credential to use.
  ARTIFACTORY_BACKUP_USERNAME: {{ .Values.secrets.artifactoryBackupUsername | default "" | quote }}
  ARTIFACTORY_BACKUP_TOKEN: {{ .Values.secrets.artifactoryBackupToken | default "" | quote }}
  # Optional: a dedicated Artifactory administrator for the quota self-service.
  # Empty is a valid state -- the code falls back to the backup pair and the
  # diagnostic says which one it used.
  ARTIFACTORY_ADMIN_USERNAME: {{ .Values.secrets.artifactoryAdminUsername | default "" | quote }}
  ARTIFACTORY_ADMIN_TOKEN: {{ .Values.secrets.artifactoryAdminToken | default "" | quote }}
  ARTIFACTORY_ADMIN_PASSWORD: {{ .Values.secrets.artifactoryAdminPassword | default "" | quote }}
  SONARQUBE_BASE_URL: {{ .Values.secrets.sonarqubeBaseUrl | default "" | quote }}
  CONFLUENCE_BASE_URL: {{ .Values.secrets.confluenceBaseUrl | default "" | quote }}