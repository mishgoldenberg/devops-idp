# ── Service Accounts for the Terraform self-service feature ──────────────────
#
# backend-sa  (devops-control-center)
#   The "RBAC anchor" SA — the terraform-job-manager RoleBinding in
#   devops-control-center references this SA so the backend pod can create
#   K8s Jobs/ConfigMaps there.
#
#   The CI/CD pipeline (template-workflow.yml) ALSO creates backend-sa in the
#   actual deployment namespace (devops-control-center-dev for the dev pipeline)
#   before patching the Deployment to use it as serviceAccountName.  Both
#   copies are listed as subjects in terraform-rbac.yaml so the feature works
#   in dev and production.
#
# devops-terraform-sa  (devops-control-center)
#   Used by the Terraform Job pods that actually run `terraform apply`.
#   Annotated for GKE Workload Identity so the pod can authenticate to GCP
#   (GCS tfstate bucket) without a key file.
#
#   One-time GCP IAM binding (run once per cluster — substitute your values):
#     gcloud iam service-accounts add-iam-policy-binding \
#       <TF_GCP_SERVICE_ACCOUNT> \
#       --role roles/iam.workloadIdentityUser \
#       --member "serviceAccount:<GCP_PROJECT>.svc.id.goog[<K8S_NAMESPACE>/devops-terraform-sa]"
#
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  labels:
    app: backend
    component: service-account
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-terraform-sa
  labels:
    app: terraform-runner
    component: service-account
  {{- with .Values.terraformServiceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
