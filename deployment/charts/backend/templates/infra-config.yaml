apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-config{{ .Values.global.nameSuffix }}
data:
  POSTGRES_HOST: {{ .Values.global.endpoints.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.global.endpoints.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.global.endpoints.postgresDB | quote }}
  DATABASE_URL: {{ .Values.global.endpoints.databaseUrl | quote }}
  POSTGRES_USER: {{ .Values.global.endpoints.postgresUser | quote }}
  REDIS_HOST: {{ .Values.global.endpoints.redisHost | quote }}
  REDIS_PORT: {{ .Values.global.endpoints.redisPort | quote }}
  INTEGRATION_TLS_VERIFY: {{ .Values.global.integrationTlsVerify | default "true" | quote }}
  # Artifactory reports its filestore as whichever mount its data dir sits on, which
  # here is a partition far smaller than the real disk — so the storage widget cannot
  # draw an honest usage bar from it. Set this to the true capacity (e.g. "6 TB") to
  # give the bar a total. Empty means "capacity unknown" and the widget says so.
  #
  # This is a RUNTIME value: it has to reach the backend container. Defining it only
  # in the Azure DevOps variable group makes it available to the pipeline, not to the
  # running pod — which is why setting it there alone had no effect.
  ARTIFACTORY_DISK_TOTAL: {{ .Values.global.artifactoryDiskTotal | default "" | quote }}
  # DevBot: runtime values, so they belong here and not only in the pipeline's
  # variable group, which the running pod never sees. See global.devbot* in values.yaml.
  DEVBOT_LLM_BASE_URL: {{ .Values.global.devbotLlmBaseUrl | default "" | quote }}
  DEVBOT_DEFAULT_MODEL: {{ .Values.global.devbotDefaultModel | default "" | quote }}
  DEVBOT_KEY_HELP_URL: {{ .Values.global.devbotKeyHelpUrl | default "" | quote }}
  DEVBOT_STREAM: {{ .Values.global.devbotStream | default "true" | quote }}
  # Trust the OpenShift router's X-Forwarded-Proto so request.url.scheme is
  # https — required for the SSO redirect_uri to match the registered value.
  FORWARDED_ALLOW_IPS: "*"
  