apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    tier: backend
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        tier: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.global.customImage.repository }}/{{ .Chart.Name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.global.customImage.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: HUB_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: HUB_ADMIN_USERNAME
            - name: HUB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: HUB_ADMIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: JWT_SECRET
            - name: AZURE_DEVOPS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: AZURE_DEVOPS_BASE_URL
            - name: AZURE_DEVOPS_ADMIN_PAT
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: AZURE_DEVOPS_ADMIN_PAT
            - name: SNOW_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: SNOW_BASE_URL
            - name: SNOW_API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: SNOW_API_USERNAME
            - name: SNOW_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: SNOW_API_PASSWORD
            - name: ARTIFACTORY_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: ARTIFACTORY_BASE_URL
            - name: SONARQUBE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: SONARQUBE_BASE_URL
            - name: CONFLUENCE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: CONFLUENCE_BASE_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: LLM_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: all-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.global.endpoints.postgresUser }}:$(POSTGRES_PASSWORD)@{{ .Values.global.endpoints.postgresHost }}:{{ .Values.global.endpoints.postgresPort }}/{{ .Values.global.endpoints.postgresDB }}"
          envFrom:
            - configMapRef:
                name: infra-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]