apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    tier: backend
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        tier: backend
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.global.customImage.repository }}/{{ .Chart.Name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.global.customImage.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: POSTGRES_HOST
              value: {{ .Values.global.endpoints.postgresHost | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.global.endpoints.postgresPort | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.global.endpoints.postgresUser | quote }}
            - name: REDIS_HOST
              value: {{ .Values.global.endpoints.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.global.endpoints.redisPort | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.global.endpoints.postgresDB | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.global.secrets.postgresPassword | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.global.secrets.redisPassword | quote }}
            - name: AZURE_DEVOPS_PAT
              value: {{ .Values.global.secrets.azureDevopsPAT | quote }}
            - name: USE_MOCK_AZURE_DEVOPS
              value: "false"
          envFrom:
            - configMapRef:
                name: {{ .Values.azureDevopsConfig.configMapName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]