# charts/frontend/values.yaml
replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/devops-idp-489012/devops-idp/frontend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

secretName: all-secrets

ingress:
  enabled: true
  className: nginx
  host: devops.internal.company
  path: /
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"