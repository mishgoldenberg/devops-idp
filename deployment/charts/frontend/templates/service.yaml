apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}{{ .Values.global.nameSuffix }}-service
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  labels:
    app: {{ .Chart.Name }}{{ .Values.global.nameSuffix }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}{{ .Values.global.nameSuffix }}