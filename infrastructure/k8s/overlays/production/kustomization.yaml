apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for production
namespace: devops-control-center

# Base resources
resources:
  - ../../base

# Environment-specific configMap
configMapGenerator:
  - name: prod-config
    literals:
      - ENVIRONMENT=production
      - USE_MOCK_DATA=false

# Patches to set replicas and resource limits
patchesStrategicMerge:
  - patches/replicas.yaml
  - patches/resources.yaml

# Update images for production
images:
  - name: devops-control-center/api-gateway
    newTag: v1.0.0
  - name: devops-control-center/frontend
    newTag: v1.0.0