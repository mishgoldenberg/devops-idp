apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-control-center

resources:
  - ../../base/namespace.yaml
  - ../../base/deployments/api-gateway.yaml
  - ../../base/configmaps/application-config.yaml
  - ../../base/secrets/secrets.example.yaml
  - ../../base/ingress.yaml

configMapGenerator:
  - name: prod-config
    literals:
      - ENVIRONMENT=production
      - USE_MOCK_DATA=false

replicas:
  - name: api-gateway
    count: 3

images:
  - name: devops-control-center/api-gateway
    newTag: v1.0.0
