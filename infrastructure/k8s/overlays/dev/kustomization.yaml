apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-control-center-dev

resources:
  - ../../base

configMapGenerator:
  - name: dev-config
    literals:
      - ENVIRONMENT=development
      - USE_MOCK_DATA=true

patchesStrategicMerge:
  - patches/replicas.yaml
  - patches/resources.yaml
