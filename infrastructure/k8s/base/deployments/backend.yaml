apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: europe-west1-docker.pkg.dev/devops-idp-489012/devops-idp/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8000"
        # Secrets and other environment variables
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        # - name: JWT_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: auth-secret
        #       key: JWT_SECRET
        # - name: SESSION_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: auth-secret
        #       key: SESSION_SECRET
        # Services URLs
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: AZURE_DEVOPS_SERVICE_URL
          value: "http://azure-devops-service:8002"
        - name: SONARQUBE_SERVICE_URL
          value: "http://sonarqube-service:8003"
        - name: ARTIFACTORY_SERVICE_URL
          value: "http://artifactory-service:8004"
        - name: SERVICENOW_SERVICE_URL
          value: "http://servicenow-service:8005"
        - name: AI_CHATBOT_SERVICE_URL
          value: "http://ai-chatbot-service:8006"
        - name: APPROVAL_SERVICE_URL
          value: "http://approval-service:8007"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5