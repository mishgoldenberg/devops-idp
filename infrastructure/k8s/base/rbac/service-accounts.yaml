# ── Service Accounts for the Terraform self-service feature ──────────────────
#
# backend-sa
#   Used by the api-gateway (backend) pod.
#   Bound via terraform-rbac.yaml to create/read K8s Jobs, ConfigMaps and Pods
#   so that the Terraform runner can be launched from the backend.
#
# devops-terraform-sa
#   Used by the Terraform Job pods that actually run `terraform apply`.
#   Annotated for GKE Workload Identity so the pod can authenticate to GCP
#   (GCS tfstate bucket) without a key file.
#   The corresponding GCP IAM binding must be applied separately:
#
#     gcloud iam service-accounts add-iam-policy-binding \
#       devops-terraform-sa@devops-idp-489012.iam.gserviceaccount.com \
#       --role roles/iam.workloadIdentityUser \
#       --member "serviceAccount:devops-idp-489012.svc.id.goog[devops-control-center/devops-terraform-sa]"
#
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: devops-control-center
  labels:
    app: backend
    component: service-account
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-terraform-sa
  namespace: devops-control-center
  labels:
    app: terraform-runner
    component: service-account
  annotations:
    # GKE Workload Identity — maps this K8s SA to the GCP SA so that
    # the Terraform container can access GCS (tfstate) without a key file.
    iam.gke.io/gcp-service-account: devops-terraform-sa@devops-idp-489012.iam.gserviceaccount.com
