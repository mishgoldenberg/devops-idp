apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-control-center-ingress
  namespace: devops-control-center-dev
  # REMOVED: nginx.ingress.kubernetes.io/rewrite-target annotation
spec:
  ingressClassName: nginx
  rules:
  - host: devops.internal.company
    http:
      paths:
      # Route /api to backend without rewriting/stripping
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      # Route everything else to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000