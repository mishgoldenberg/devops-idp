apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-control-center-ingress
  namespace: devops-control-center
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Add your specific ingress controller annotations
spec:
  ingressClassName: nginx # Adjust based on your ingress controller
  rules:
    - host: devops.internal.company # Replace with your internal domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
  tls:
    - hosts:
        - devops.internal.company
      secretName: devops-tls-secret # Create this secret with your TLS certificates

