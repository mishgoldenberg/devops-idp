apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
  namespace: devops-control-center
data:
  # General
  LOG_LEVEL: "info"
  
  # Feature flags
  ENABLE_APPROVALS: "true"
  ENABLE_OBSERVABILITY: "true"
  ENABLE_USAGE_METRICS: "true"
  ENABLE_AUDIT_LOGGING: "true"
  
  # Mock data flags (set to false in production)
  USE_MOCK_AZURE_DEVOPS: "false"
  USE_MOCK_SONARQUBE: "false"
  USE_MOCK_ARTIFACTORY: "false"
  USE_MOCK_SERVICENOW: "false"
  USE_MOCK_AI_CHATBOT: "false"
  
  # CORS
  CORS_ORIGINS: "http://localhost:3000,https://devops.internal.company"
  
  # Rate limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"

