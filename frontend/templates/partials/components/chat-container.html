<main class="flex-1 min-h-0 flex flex-col page-shell" data-chat-base="/api/chat">
	<header class="page-header">
		<div>
			<h1 class="page-title">DevBot Chat</h1>
			<p class="page-subtitle">
				Ask about your Azure DevOps projects, work items, pipelines, and pull requests.
			</p>
		</div>
		<div class="flex gap-2 items-center">
			<span id="chat-page-status" class="text-xs text-base-content/60">Connecting…</span>
			<button id="chat-page-new" class="btn btn-outline btn-sm">New conversation</button>
		</div>
	</header>

	<section class="page-content flex flex-1 min-h-0 flex-col gap-3">
		<div class="alert bg-base-100 border border-base-300 text-xs py-2" id="chat-page-warning" style="display:none">
			<span></span>
		</div>

		<div
			id="chat-page-messages"
			class="flex-1 overflow-y-auto bg-base-100 border border-base-300 rounded-box p-4 space-y-3 text-sm"
		>
			<div class="text-xs text-base-content/60 text-center py-10">
				Try asking: <em>"What work items are assigned to me?"</em> or
				<em>"List my Azure DevOps projects"</em>.
			</div>
		</div>

		<form id="chat-page-form" class="flex gap-2">
			<input
				id="chat-page-input"
				type="text"
				class="input input-bordered flex-1"
				placeholder="Ask DevBot…"
				autocomplete="off"
				required
				maxlength="4000"
			/>
			<button type="submit" class="btn btn-primary" id="chat-page-send">Send</button>
		</form>
	</section>
</main>

<script>
	(function () {
		const root = document.querySelector("[data-chat-base]");
		if (!root) return;
		const BASE = root.dataset.chatBase || "/api/chat";

		const messages = document.getElementById("chat-page-messages");
		const form = document.getElementById("chat-page-form");
		const input = document.getElementById("chat-page-input");
		const sendBtn = document.getElementById("chat-page-send");
		const status = document.getElementById("chat-page-status");
		const newBtn = document.getElementById("chat-page-new");
		const warn = document.getElementById("chat-page-warning");

		const SESSION_KEY = "devbot.session_id";

		function sessionId() {
			let sid = sessionStorage.getItem(SESSION_KEY);
			if (!sid) {
				sid =
					(crypto.randomUUID && crypto.randomUUID()) ||
					String(Date.now()) + "-" + Math.random().toString(16).slice(2);
				sessionStorage.setItem(SESSION_KEY, sid);
			}
			return sid;
		}

		function escapeHtml(s) {
			return String(s ?? "").replace(/[&<>"']/g, (c) => ({
				"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
			}[c]));
		}

		function renderMarkdown(s) {
			// Line-based Markdown renderer. Everything is HTML-escaped before
			// any formatting, so model output can never inject markup. Handles
			// headings, fenced code, tables, ordered/unordered lists,
			// blockquotes, paragraphs, and inline bold/italic/code/links.
			const lines = escapeHtml(s).split("\n");

			function inline(text) {
				let h = text;
				h = h.replace(/`([^`]+)`/g, '<code class="px-1 rounded bg-base-300/60">$1</code>');
				h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
				h = h.replace(/\*([^*]+)\*/g, "<em>$1</em>");
				h = h.replace(
					/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
					'<a href="$2" target="_blank" rel="noopener" class="link link-primary">$1</a>',
				);
				h = h.replace(
					/(^|[^"'>])(https?:\/\/[^\s<>"']+)/g,
					(m, pre, url) =>
						pre +
						'<a href="' + url + '" target="_blank" rel="noopener" class="link link-primary">' +
						url + "</a>",
				);
				return h;
			}

			function isTableStart(idx) {
				return (
					/^\s*\|.*\|\s*$/.test(lines[idx]) &&
					idx + 1 < lines.length &&
					/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[idx + 1]) &&
					lines[idx + 1].includes("-")
				);
			}

			function isBlockStart(idx) {
				const ln = lines[idx];
				return (
					!ln.trim() ||
					/^\s*```/.test(ln) ||
					/^#{1,6}\s+/.test(ln) ||
					/^\s*\d+\.\s+/.test(ln) ||
					/^\s*[-*]\s+/.test(ln) ||
					/^\s*&gt;\s?/.test(ln) ||
					isTableStart(idx)
				);
			}

			function cells(row) {
				return row
					.replace(/^\s*\|/, "")
					.replace(/\|\s*$/, "")
					.split("|")
					.map(function (c) { return c.trim(); });
			}

			const out = [];
			let i = 0;
			while (i < lines.length) {
				const line = lines[i];

				if (!line.trim()) { i++; continue; }

				// Fenced code block — escaped content, no inline parsing.
				if (/^\s*```/.test(line)) {
					const code = [];
					i++;
					while (i < lines.length && !/^\s*```/.test(lines[i])) {
						code.push(lines[i]);
						i++;
					}
					i++;
					out.push(
						'<pre class="bg-base-300/60 rounded p-2 my-1 overflow-x-auto text-xs">' +
						"<code>" + code.join("\n") + "</code></pre>",
					);
					continue;
				}

				// Heading.
				const h = line.match(/^(#{1,6})\s+(.+)$/);
				if (h) {
					const weight = h[1].length <= 2 ? "font-bold" : "font-semibold";
					out.push('<div class="' + weight + ' text-sm mt-2 mb-1">' + inline(h[2]) + "</div>");
					i++;
					continue;
				}

				// Table.
				if (isTableStart(i)) {
					const head = cells(line);
					i += 2;
					const rows = [];
					while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
						rows.push(cells(lines[i]));
						i++;
					}
					let t = '<div class="overflow-x-auto my-1"><table class="table table-xs"><thead><tr>';
					t += head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("");
					t += "</tr></thead><tbody>";
					t += rows
						.map(function (r) {
							return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
						})
						.join("");
					out.push(t + "</tbody></table></div>");
					continue;
				}

				// Ordered list.
				if (/^\s*\d+\.\s+/.test(line)) {
					const items = [];
					while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
						items.push("<li>" + inline(lines[i].replace(/^\s*\d+\.\s+/, "")) + "</li>");
						i++;
					}
					out.push('<ol class="list-decimal ml-5 my-1">' + items.join("") + "</ol>");
					continue;
				}

				// Unordered list.
				if (/^\s*[-*]\s+/.test(line)) {
					const items = [];
					while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
						items.push("<li>" + inline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>");
						i++;
					}
					out.push('<ul class="list-disc ml-5 my-1">' + items.join("") + "</ul>");
					continue;
				}

				// Blockquote (">" is "&gt;" post-escape).
				if (/^\s*&gt;\s?/.test(line)) {
					const quote = [];
					while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
						quote.push(inline(lines[i].replace(/^\s*&gt;\s?/, "")));
						i++;
					}
					out.push(
						'<blockquote class="border-l-2 border-base-300 pl-2 my-1 italic">' +
						quote.join("<br>") + "</blockquote>",
					);
					continue;
				}

				// Paragraph — consecutive lines until the next block.
				const para = [];
				while (i < lines.length && !isBlockStart(i)) {
					para.push(inline(lines[i]));
					i++;
				}
				if (para.length) out.push('<p class="my-1">' + para.join("<br>") + "</p>");
			}

			return out.join("");
		}

		function appendMessage(role, text, opts) {
			const isUser = role === "user";
			const wrap = document.createElement("div");
			wrap.className = "flex " + (isUser ? "justify-end" : "justify-start");
			const bubble = document.createElement("div");
			bubble.className =
				"max-w-[80%] rounded-lg px-3 py-2 leading-relaxed " +
				(isUser
					? "bg-primary text-primary-content"
					: "bg-base-200 border border-base-300");
			if (opts && opts.placeholder) {
				bubble.innerHTML = '<span class="loading loading-dots loading-sm"></span>';
				bubble.dataset.placeholder = "true";
			} else {
				bubble.innerHTML = isUser ? escapeHtml(text) : renderMarkdown(text);
			}
			wrap.appendChild(bubble);
			messages.appendChild(wrap);
			messages.scrollTop = messages.scrollHeight;
			return bubble;
		}

		async function refreshStatus() {
			try {
				const res = await fetch(BASE + "/health", { credentials: "same-origin" });
				if (!res.ok) throw new Error("http " + res.status);
				const j = await res.json();
				const d = (j && j.data) || {};
				const bits = [];
				bits.push(d.llm_configured ? "AI: ready" : "AI: not configured");
				bits.push(d.ado_connected ? "ADO: connected" : "ADO: not connected");
				status.textContent = bits.join(" · ");
				if (!d.ado_connected) {
					warn.style.display = "";
					warn.firstElementChild.textContent =
						"Azure DevOps is not connected — open the Azure DevOps page and paste your PAT to enable tool calls.";
				} else if (!d.llm_configured) {
					warn.style.display = "";
					warn.firstElementChild.textContent =
						"The AI backend is not configured for this environment yet (LLM_BASE_URL is unset).";
				} else {
					warn.style.display = "none";
				}
			} catch (_err) {
				status.textContent = "Status unavailable";
			}
		}

		async function loadHistory() {
			const sid = sessionStorage.getItem(SESSION_KEY);
			if (!sid) return;
			try {
				const res = await fetch(BASE + "/sessions/" + encodeURIComponent(sid) + "/history", {
					credentials: "same-origin",
				});
				if (!res.ok) return;
				const j = await res.json();
				const msgs = (j && j.data && j.data.messages) || [];
				if (!msgs.length) return;
				messages.innerHTML = "";
				for (const m of msgs) {
					if (m && (m.role === "user" || m.role === "assistant") && m.content) {
						appendMessage(m.role, String(m.content));
					}
				}
			} catch (_e) { /* silent */ }
		}

		async function send(text) {
			appendMessage("user", text);
			const placeholder = appendMessage("assistant", "", { placeholder: true });
			sendBtn.disabled = true;
			input.disabled = true;
			try {
				const res = await fetch(BASE + "/message", {
					method: "POST",
					credentials: "same-origin",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ message: text, session_id: sessionId() }),
				});
				const body = await res.json().catch(() => ({}));
				if (!res.ok) {
					placeholder.innerHTML = renderMarkdown(
						"**Error:** " + (body && body.detail ? String(body.detail) : "Request failed."),
					);
					return;
				}
				const reply = (body && body.data && body.data.reply) || "(no response)";
				placeholder.removeAttribute("data-placeholder");
				placeholder.innerHTML = renderMarkdown(reply);
			} catch (_err) {
				placeholder.innerHTML = renderMarkdown("**Network error.** Please try again.");
			} finally {
				sendBtn.disabled = false;
				input.disabled = false;
				input.focus();
			}
		}

		form.addEventListener("submit", (e) => {
			e.preventDefault();
			const text = input.value.trim();
			if (!text) return;
			input.value = "";
			send(text);
		});

		newBtn.addEventListener("click", async () => {
			const sid = sessionStorage.getItem(SESSION_KEY);
			if (sid) {
				try {
					await fetch(BASE + "/sessions/" + encodeURIComponent(sid), {
						method: "DELETE",
						credentials: "same-origin",
					});
				} catch (_e) { /* ignore */ }
			}
			sessionStorage.removeItem(SESSION_KEY);
			messages.innerHTML =
				'<div class="text-xs text-base-content/60 text-center py-10">New conversation started.</div>';
			input.focus();
		});

		refreshStatus();
		loadHistory();
	})();
</script>
