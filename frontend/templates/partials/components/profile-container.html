<div class="page-shell">
	<header class="page-header">
		<div>
			<h1 class="page-title">Profile</h1>
			<p class="page-subtitle">Update your appearance name.</p>
		</div>
	</header>
	<div class="page-content">
		<div class="max-w-2xl section-card">
			<div class="card-body gap-4">
				{% if saved %}
				<div class="alert alert-success alert-soft text-sm">
					<span>Profile updated.</span>
				</div>
				{% endif %}
				<form action="/ui/profile" method="post" class="space-y-4">
					<div>
						<label class="label"><span class="label-text">Appearance name</span></label>
						<input class="input input-bordered w-full" name="display_name" value="{{ user.display_name }}" />
					</div>
					<div>
						<label class="label"><span class="label-text">Gmail</span></label>
						<input class="input input-bordered w-full" value="{{ email }}" readonly />
					</div>
					<div class="flex justify-end">
						<button class="btn btn-primary" type="submit">Save</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
