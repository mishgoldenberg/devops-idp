<div
	class="section-card h-full flex flex-col"
>
	<div class="card-body p-5 flex flex-col h-full gap-4">
		<!-- Header -->
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-warning/30 bg-warning/10"
			>
				<svg
					viewBox="0 0 24 24"
					class="h-5 w-5 fill-current text-warning"
					aria-hidden="true"
				>
					<path
						d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"
					/>
				</svg>
			</div>
			<h3
				class="text-sm font-bold uppercase tracking-widest text-base-content/70"
			>
				Code Quality
			</h3>
		</div>
		<!-- Project rows -->
		<ul
			class="flex flex-col gap-2 flex-1 min-h-0 overflow-y-auto overscroll-contain"
		>
			{% for p in projects %}
			<li
				class="rounded-lg bg-base-200/60 border border-base-300 px-3 py-2.5 flex flex-col gap-2"
			>
				<div class="flex items-center justify-between gap-2">
					<span class="text-sm font-semibold text-base-content truncate"
						>{{ p.name }}</span
					>
					<span
						class="badge badge-sm shrink-0 {{ 'badge-success' if p.quality_gate_status == 'OK' else 'badge-error' }}"
					>
						{{ 'PASSED' if p.quality_gate_status == 'OK' else 'FAILED' }}
					</span>
				</div>
				<div class="flex items-center gap-4 text-xs">
					<span class="flex items-center gap-1">
						<span class="font-bold text-error">{{ p.bugs }}</span>
						<span class="text-base-content/50">bugs</span>
					</span>
					<span class="flex items-center gap-1">
						<span class="font-bold text-warning">{{ p.vulnerabilities }}</span>
						<span class="text-base-content/50">vulns</span>
					</span>
					<span class="flex items-center gap-1 ml-auto">
						<span class="font-bold text-success">{{ p.coverage }}%</span>
						<span class="text-base-content/50">cov</span>
					</span>
				</div>
			</li>
			{% endfor %}
		</ul>
	</div>
</div>
