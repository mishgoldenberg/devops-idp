<div
	class="card bg-base-100 border border-base-300 shadow h-full flex flex-col"
>
	<div class="card-body p-5 flex flex-col h-full gap-4">
		<!-- Header -->
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-info/30 bg-info/10"
			>
				<svg
					viewBox="0 0 24 24"
					class="h-5 w-5 fill-current text-info"
					aria-hidden="true"
				>
					<path
						d="M3 3h18a1 1 0 011 1v3a1 1 0 01-1 1h-1v11a1 1 0 01-1 1H5a1 1 0 01-1-1V8H3a1 1 0 01-1-1V4a1 1 0 011-1zm5 8a1 1 0 000 2h8a1 1 0 000-2H8z"
					/>
				</svg>
			</div>
			<h3
				class="text-sm font-bold uppercase tracking-widest text-base-content/70"
			>
				Artifactory Storage
			</h3>
		</div>
		<!-- Overall usage gauge -->
		<div class="flex flex-col items-center gap-1.5">
			<span class="text-4xl font-bold text-info"
				>{{ storage.percentage }}%</span
			>
			<span class="text-xs text-base-content/60"
				>{{ storage.used }} of {{ storage.total }} used</span
			>
			<progress
				class="progress progress-info w-full mt-1"
				value="{{ storage.percentage }}"
				max="100"
			></progress>
		</div>
		<!-- Per-repo breakdown -->
		<ul
			class="flex flex-col gap-2 flex-1 min-h-0 overflow-y-auto overscroll-contain"
		>
			{% for repo in storage.repositories %}
			<li class="flex items-center gap-2">
				<span class="text-xs text-base-content/70 w-28 shrink-0 truncate"
					>{{ repo.name }}</span
				>
				<progress
					class="progress progress-info flex-1"
					value="{{ repo.percentage }}"
					max="100"
				></progress>
				<span class="text-xs text-base-content/60 shrink-0 w-14 text-right"
					>{{ repo.used }}</span
				>
			</li>
			{% endfor %}
		</ul>
	</div>
</div>
