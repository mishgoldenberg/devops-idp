<div
	class="card bg-base-100 border border-base-300 shadow h-full flex flex-col"
>
	<div class="card-body p-5 flex flex-col h-full gap-4">
		<!-- Header -->
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-primary/30 bg-primary/10"
			>
				<svg
					viewBox="0 0 16 16"
					class="h-5 w-5 fill-current text-primary"
					aria-hidden="true"
				>
					<path
						d="M15 3.622v8.512L11.5 15l-5.425-1.975v1.958L3.004 10.97l8.951.7V4.005L15 3.622zm-2.984.428L6.994 1v2.001L2.382 4.356 1 6.13v4.029l1.978.873V5.869l9.038-1.818z"
					/>
				</svg>
			</div>
			<h3
				class="text-sm font-bold uppercase tracking-widest text-base-content/70"
			>
				Azure DevOps Tasks
			</h3>
		</div>
		{% if error %}
		<div
			class="rounded-xl border border-warning/30 bg-warning/10 px-4 py-3 text-sm text-base-content/80"
		>
			<p class="font-semibold text-warning">Azure DevOps unavailable</p>
			<p class="mt-1">{{ error }}</p>
			<div class="mt-2 flex items-center gap-2">
				<input type="password" placeholder="Paste PAT" class="input input-bordered input-xs flex-1 ado-pat-input" />
				<button type="button" class="btn btn-xs btn-primary ado-pat-save-btn">Save PAT</button>
			</div>
		</div>
		{% else %}
		<!-- 2×2 stat grid -->
		<div class="grid grid-cols-2 gap-3 flex-1 min-h-0">
			<!-- To Do -->
			<div
				class="bg-accent/15 border border-accent/25 rounded-xl flex flex-col items-center justify-center gap-1"
			>
				<span
					class="text-xs font-semibold uppercase tracking-wider text-accent/80"
					>To Do</span
				>
				<span class="text-4xl font-bold text-accent">{{ counts.todo }}</span>
			</div>
			<!-- In Progress -->
			<div
				class="bg-primary/15 border border-primary/25 rounded-xl flex flex-col items-center justify-center gap-1"
			>
				<span
					class="text-xs font-semibold uppercase tracking-wider text-primary/80"
					>In Progress</span
				>
				<span class="text-4xl font-bold text-primary"
					>{{ counts.in_progress }}</span
				>
			</div>
			<!-- Blocked -->
			<div
				class="bg-error/15 border border-error/25 rounded-xl flex flex-col items-center justify-center gap-1"
			>
				<span
					class="text-xs font-semibold uppercase tracking-wider text-error/80"
					>Blocked</span
				>
				<span class="text-4xl font-bold text-error">{{ counts.blocked }}</span>
			</div>
			<!-- Done -->
			<div
				class="bg-success/15 border border-success/25 rounded-xl flex flex-col items-center justify-center gap-1"
			>
				<span
					class="text-xs font-semibold uppercase tracking-wider text-success/80"
					>Done</span
				>
				<span class="text-4xl font-bold text-success">{{ counts.done }}</span>
			</div>
		</div>
		{% endif %}
	</div>
</div>
<script>
	(function () {
		if (window.__adoPatBinderAttached) return;
		window.__adoPatBinderAttached = true;
		document.addEventListener("click", async function (e) {
			const btn = e.target.closest(".ado-pat-save-btn");
			if (!btn) return;
			const wrap = btn.closest("div");
			const input = wrap?.querySelector(".ado-pat-input");
			const pat = (input?.value || "").trim();
			if (!pat) return;
			btn.disabled = true;
			try {
				const res = await fetch("/ui/azure-devops/pat", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ pat }),
					credentials: "same-origin",
				});
				if (res.ok) {
					document.getElementById("refresh-btn")?.click();
				}
			} finally {
				btn.disabled = false;
			}
		});
	})();
</script>
