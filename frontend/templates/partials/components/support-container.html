<div class="page-shell">
	<header class="page-header">
		<div>
			<h1 class="page-title">Support</h1>
			<p class="page-subtitle">View, open and reply to your ServiceNow tickets</p>
		</div>
		<div class="flex items-center gap-2">
			{% with system_key = 'servicenow' %}
				{% include "partials/components/open-system-button.html" %}
			{% endwith %}
			<button id="support-new-ticket-btn" class="btn btn-primary btn-sm">New Ticket</button>
		</div>
	</header>

	<div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-5 gap-6 p-6">
		<div class="lg:col-span-2 section-card min-h-0">
			<div class="card-body p-0 min-h-0 flex flex-col">
				<div class="px-4 py-3 border-b border-base-300 section-title">My Tickets</div>
				<div id="support-ticket-error" class="hidden mx-3 mt-3 alert alert-warning alert-soft text-xs"></div>
				<ul id="support-ticket-list" class="flex-1 min-h-0 overflow-y-auto divide-y divide-base-300"></ul>
			</div>
		</div>
		<div class="lg:col-span-3 section-card min-h-0">
			<div class="card-body min-h-0 flex flex-col gap-3">
				<div id="support-ticket-title" class="section-title text-lg">Select a ticket</div>
				<div id="support-conversation" class="flex-1 min-h-0 overflow-y-auto border border-base-300 rounded-lg p-3 space-y-2"></div>
				<div class="flex gap-2">
					<textarea id="support-reply" class="textarea textarea-bordered flex-1" rows="2" placeholder="Write a reply..."></textarea>
					<button id="support-send-reply" class="btn btn-primary self-end">Send</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="support-new-ticket-overlay" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
	<div class="w-full max-w-lg rounded-xl border border-base-300 bg-base-100 shadow-2xl">
		<div class="px-5 py-4 border-b border-base-300">
		<h3 class="font-bold text-lg">Create Ticket</h3>
		</div>
		<div class="p-5 space-y-3">
			<input id="support-new-title" class="input input-bordered w-full" placeholder="Title" />
			<textarea id="support-new-description" class="textarea textarea-bordered w-full" rows="4" placeholder="Description"></textarea>
			<select id="support-new-priority" class="select select-bordered w-full">
				<option value="1">1 - Critical</option>
				<option value="2">2 - High</option>
				<option value="3" selected>3 - Moderate</option>
				<option value="4">4 - Low</option>
				<option value="5">5 - Planning</option>
			</select>
			<div id="support-new-ticket-error" class="hidden alert alert-error alert-soft text-xs whitespace-pre-wrap"></div>
		</div>
		<div class="px-5 pb-5 flex justify-end gap-2">
			<button id="support-cancel-ticket" class="btn">Cancel</button>
			<button id="support-create-ticket" class="btn btn-primary">Create</button>
		</div>
	</div>
</div>

<script>
	(function () {
		let selectedId = null;
		const listEl = document.getElementById("support-ticket-list");
		const errorEl = document.getElementById("support-ticket-error");
		const titleEl = document.getElementById("support-ticket-title");
		const convEl = document.getElementById("support-conversation");
		const replyEl = document.getElementById("support-reply");
		const modal = document.getElementById("support-new-ticket-overlay");
		const modalErrEl = document.getElementById("support-new-ticket-error");

		// ── helpers ────────────────────────────────────────────────────────

		function esc(s) {
			if (s == null) return "";
			return String(s)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#39;");
		}

		// Normalize whatever FastAPI sends in `detail` into a readable string.
		// Handles: string, null, array (pydantic), or dict (legacy shape).
		function extractErrorMessage(json, fallback) {
			if (!json) return fallback;
			const d = json.detail;
			if (typeof d === "string" && d.trim()) return d;
			if (Array.isArray(d)) {
				const parts = d.map((e) => e?.msg || e?.message).filter(Boolean);
				if (parts.length) return parts.join("; ");
			}
			if (d && typeof d === "object") {
				// Legacy { message, instance, snow_response } payload.
				if (d.message) return String(d.message);
				try { return JSON.stringify(d); } catch (_) { /* ignore */ }
			}
			if (typeof json.message === "string" && json.message.trim()) return json.message;
			return fallback;
		}

		async function parseJsonSafe(res) {
			try { return await res.json(); }
			catch (_) {
				try { return { detail: (await res.text()) || "Internal Server Error" }; }
				catch (__) { return { detail: "Internal Server Error" }; }
			}
		}

		function showListError(msg) {
			if (!errorEl) return;
			errorEl.textContent = msg;
			errorEl.classList.remove("hidden");
		}

		function clearListError() {
			if (!errorEl) return;
			errorEl.classList.add("hidden");
			errorEl.textContent = "";
		}

		function showModalError(msg) {
			if (!modalErrEl) return;
			modalErrEl.textContent = msg;
			modalErrEl.classList.remove("hidden");
		}

		function clearModalError() {
			if (!modalErrEl) return;
			modalErrEl.classList.add("hidden");
			modalErrEl.textContent = "";
		}

		function fmtDt(iso) {
			if (!iso) return "";
			const d = new Date(iso);
			return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
		}

		// ── list ──────────────────────────────────────────────────────────

		// Cheap local mirror of the user's favorited ticket IDs — lets the
		// Support page pre-fill the star state on first render without
		// pulling in the whole Favorites section partial. Populated once
		// per page load in loadTickets().
		const favoritedTickets = new Set();

		async function loadFavoritedTickets() {
			try {
				const res = await fetch("/api/favorites", { credentials: "same-origin" });
				if (!res.ok) return;
				const body = await res.json();
				favoritedTickets.clear();
				(Array.isArray(body && body.data) ? body.data : []).forEach((f) => {
					if (f.item_type === "ticket") favoritedTickets.add(String(f.item_id));
				});
			} catch (_err) { /* silent — empty set is a safe default */ }
		}

		async function loadTickets() {
			clearListError();
			listEl.innerHTML = '<li class="px-4 py-3 text-sm opacity-60">Loading…</li>';
			let res;
			try {
				res = await fetch("/api/support/tickets", { credentials: "same-origin" });
			} catch (netErr) {
				listEl.innerHTML = "";
				showListError("Could not reach the portal backend. Check your connection and try again.");
				return;
			}
			const json = await parseJsonSafe(res);
			if (!res.ok) {
				listEl.innerHTML = "";
				showListError(extractErrorMessage(json, "Failed to load tickets (HTTP " + res.status + ")."));
				return;
			}
			const tickets = Array.isArray(json?.data) ? json.data : [];
			if (tickets.length === 0) {
				listEl.innerHTML = '<li class="px-4 py-6 text-sm text-center opacity-60">No tickets yet. Click <span class="font-semibold">New Ticket</span> to open one.</li>';
				return;
			}
			// Fire favorites + tickets in parallel; favorites is best-effort
			// and doesn't block the initial render if it fails.
			await loadFavoritedTickets();
			listEl.innerHTML = tickets.map((t) => {
				const id = esc(t.sys_id);
				const name = esc(t.short_description || t.number || "Ticket");
				const pinned = favoritedTickets.has(String(t.sys_id)) ||
					!!(window.portalFavorites && window.portalFavorites.has("ticket", t.sys_id));
				return `
				<li class="flex items-stretch">
					<button class="flex-1 text-left px-4 py-3 hover:bg-base-200 transition-colors" data-id="${id}">
						<div class="text-xs text-primary font-semibold">${esc(t.number || "")}</div>
						<div class="text-sm">${esc(t.short_description || "(no description)")}</div>
						<div class="text-xs opacity-60">${esc(t.state || "")}</div>
					</button>
					<button
						type="button"
						class="px-3 text-base-content/40 hover:text-warning hover:bg-base-200 transition-colors"
						data-support-fav
						data-id="${id}"
						data-name="${name}"
						aria-pressed="${pinned ? "true" : "false"}"
						aria-label="${pinned ? "Remove from favorites" : "Add to favorites"}"
						title="${pinned ? "Remove from favorites" : "Add to favorites"}"
					>
						<svg viewBox="0 0 24 24" class="w-4 h-4" fill="${pinned ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"></polygon>
						</svg>
					</button>
				</li>`;
			}).join("");
			listEl.querySelectorAll("button[data-id]:not([data-support-fav])").forEach((btn) => {
				btn.addEventListener("click", () => openTicket(btn.dataset.id));
			});
			listEl.querySelectorAll("button[data-support-fav]").forEach((btn) => {
				btn.addEventListener("click", async (e) => {
					e.stopPropagation();
					const id = btn.dataset.id;
					const pressed = btn.getAttribute("aria-pressed") === "true";
					if (window.portalFavorites) {
						try {
							await window.portalFavorites.toggle("ticket", id, btn.dataset.name);
							const nowPinned = window.portalFavorites.has("ticket", id);
							setFavVisual(btn, nowPinned);
							if (nowPinned) favoritedTickets.add(id); else favoritedTickets.delete(id);
						} catch (_err) { /* toast already raised */ }
						return;
					}
					// The favorites section only mounts on the dashboard; on
					// the Support page we fall back to calling the API directly.
					try {
						const res = await fetch("/api/favorites", {
							method: pressed ? "DELETE" : "POST",
							credentials: "same-origin",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify(
								pressed
									? { item_type: "ticket", item_id: id }
									: {
											item_type: "ticket",
											item_id: id,
											item_name: btn.dataset.name,
										},
							),
						});
						if (!res.ok) throw new Error("http " + res.status);
						setFavVisual(btn, !pressed);
						if (pressed) favoritedTickets.delete(id); else favoritedTickets.add(id);
						window.portalToast?.({
							kind: pressed ? "info" : "success",
							message: pressed ? "Removed from favorites." : "Added to favorites.",
						});
					} catch (_err) {
						window.portalToast?.({ kind: "error", message: "Could not update favorite." });
					}
				});
			});
			function setFavVisual(btn, pinned) {
				btn.setAttribute("aria-pressed", pinned ? "true" : "false");
				btn.setAttribute("aria-label", pinned ? "Remove from favorites" : "Add to favorites");
				btn.setAttribute("title", pinned ? "Remove from favorites" : "Add to favorites");
				const svg = btn.querySelector("svg");
				if (svg) svg.setAttribute("fill", pinned ? "currentColor" : "none");
				btn.classList.toggle("text-warning", pinned);
				btn.classList.toggle("text-base-content/40", !pinned);
			}

			// Deep-link support: /ui/support?ticket=<sys_id> auto-opens the ticket
			// once tickets have loaded. Used by the ServiceNow dashboard widget.
			try {
				const params = new URLSearchParams(window.location.search);
				const target = params.get("ticket");
				if (target && tickets.some((t) => t.sys_id === target)) {
					openTicket(target);
					fetch("/api/items/mark-seen", {
						method: "POST",
						credentials: "same-origin",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ source: "servicenow", item_id: target }),
						keepalive: true,
					}).catch(() => {});
					const url = new URL(window.location.href);
					url.searchParams.delete("ticket");
					window.history.replaceState({}, "", url.toString());
				}
			} catch (_) { /* silent */ }
		}

		// ── detail / conversation ────────────────────────────────────────

		async function openTicket(id) {
			selectedId = id;
			titleEl.textContent = "Loading…";
			convEl.innerHTML = '<div class="text-sm opacity-60">Loading conversation…</div>';
			let res;
			try {
				res = await fetch("/api/support/tickets/" + encodeURIComponent(id), { credentials: "same-origin" });
			} catch (netErr) {
				titleEl.textContent = "Ticket";
				convEl.innerHTML = '<div class="text-sm text-error">Could not reach the portal backend.</div>';
				return;
			}
			const json = await parseJsonSafe(res);
			if (!res.ok) {
				titleEl.textContent = "Ticket";
				const msg = extractErrorMessage(json, "Failed to load ticket details (HTTP " + res.status + ").");
				convEl.innerHTML = '<div class="text-sm text-error">' + esc(msg) + '</div>';
				return;
			}
			const t = json?.data || {};
			titleEl.textContent = `${t.number || ""} ${t.short_description || ""}`.trim() || "Ticket";
			const convo = Array.isArray(t.conversation) ? t.conversation : [];
			if (convo.length === 0) {
				convEl.innerHTML = '<div class="text-sm opacity-60">No messages yet. Write a reply below to start the conversation.</div>';
			} else {
				convEl.innerHTML = convo.map((m) => `
					<div class="rounded border border-base-300 p-2">
						<div class="text-xs opacity-60">${esc(m.sys_created_by || "user")} • ${esc(fmtDt(m.sys_created_on))}</div>
						<div class="text-sm whitespace-pre-wrap">${esc(m.value || "")}</div>
					</div>
				`).join("");
			}
			convEl.scrollTop = convEl.scrollHeight;
		}

		// ── reply ────────────────────────────────────────────────────────

		document.getElementById("support-send-reply")?.addEventListener("click", async () => {
			if (!selectedId) return;
			const body = replyEl.value.trim();
			if (!body) return;
			const sendBtn = document.getElementById("support-send-reply");
			sendBtn.disabled = true;
			try {
				const res = await fetch("/api/support/tickets/" + encodeURIComponent(selectedId) + "/reply", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ message: body }),
					credentials: "same-origin",
				});
				const json = await parseJsonSafe(res);
				if (!res.ok) {
					const msg = extractErrorMessage(json, "Failed to send reply.");
					convEl.insertAdjacentHTML(
						"beforeend",
						'<div class="text-sm text-error">' + esc(msg) + '</div>'
					);
					convEl.scrollTop = convEl.scrollHeight;
					return;
				}
				replyEl.value = "";
				openTicket(selectedId);
			} catch (_) {
				convEl.insertAdjacentHTML(
					"beforeend",
					'<div class="text-sm text-error">Could not reach the portal backend.</div>'
				);
			} finally {
				sendBtn.disabled = false;
			}
		});

		// ── new-ticket modal ─────────────────────────────────────────────

		function openModal() {
			clearModalError();
			modal?.classList.remove("hidden");
			modal?.classList.add("flex");
		}

		function closeModal() {
			modal?.classList.add("hidden");
			modal?.classList.remove("flex");
			clearModalError();
		}

		document.getElementById("support-new-ticket-btn")?.addEventListener("click", openModal);
		document.getElementById("support-cancel-ticket")?.addEventListener("click", closeModal);

		document.getElementById("support-create-ticket")?.addEventListener("click", async () => {
			const title = (document.getElementById("support-new-title")?.value || "").trim();
			const description = (document.getElementById("support-new-description")?.value || "").trim();
			const priority = document.getElementById("support-new-priority")?.value || "3";
			if (!title || !description) {
				showModalError("Title and description are required.");
				return;
			}
			clearModalError();
			const createBtn = document.getElementById("support-create-ticket");
			createBtn.disabled = true;
			try {
				const res = await fetch("/api/support/tickets", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ title, description, priority }),
					credentials: "same-origin",
				});
				const json = await parseJsonSafe(res);
				if (!res.ok) {
					showModalError(extractErrorMessage(json, "Failed to create ticket (HTTP " + res.status + ")."));
					return;
				}
				closeModal();
				document.getElementById("support-new-title").value = "";
				document.getElementById("support-new-description").value = "";
				await loadTickets();
				if (json?.data?.sys_id) openTicket(json.data.sys_id);
			} catch (_) {
				showModalError("Could not reach the portal backend. Try again in a moment.");
			} finally {
				createBtn.disabled = false;
			}
		});

		loadTickets();
	})();
</script>
