<div class="page-shell">
	<header class="page-header">
		<div>
			<h1 class="page-title">Automations</h1>
			<p class="page-subtitle">Request self-service automations. Admin approval is required before execution.</p>
		</div>
		<a href="/ui/my-requests" class="btn btn-outline btn-sm">My Requests</a>
	</header>

	<div class="page-content-flush">
		<div class="portal-content-container">
		<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
			<button id="ado-self-service-card" class="section-card-interactive text-left">
				<div class="card-body">
					<h3 class="card-title">Azure DevOps Project Creation</h3>
					<p class="text-sm text-base-content/60">Request a new Azure DevOps project. Runs after admin approval.</p>
				</div>
			</button>
		</div>
		<div id="ado-create-status" class="text-sm mt-5" role="status" aria-live="polite"></div>
		</div>
	</div>
</div>

<dialog id="ado-create-modal" class="modal">
	<div class="modal-box">
		<h3 class="font-bold text-lg">Request Azure DevOps Project</h3>
		<p class="text-sm text-base-content/60 mt-1">Your request will be queued for admin approval.</p>
		<form id="ado-create-form" class="grid grid-cols-1 gap-3 mt-3" novalidate>
			<div>
				<input
					class="input input-bordered w-full"
					type="text"
					name="project_name"
					placeholder="Project name"
					required
					minlength="2"
					maxlength="63"
					pattern="^[A-Za-z0-9][A-Za-z0-9 _\-.]{1,62}$"
					aria-describedby="ado-create-err-project_name"
				/>
				<p
					id="ado-create-err-project_name"
					class="text-xs text-error mt-1 hidden"
					data-error-for="project_name"
				></p>
			</div>
			<select class="select select-bordered" name="process_type">
				<option>Scrum</option>
				<option>Agile</option>
				<option>CMMI</option>
				<option>Basic</option>
			</select>
			<div>
				<input
					class="input input-bordered w-full"
					type="email"
					name="admin_username"
					placeholder="Admin email"
					required
					aria-describedby="ado-create-err-admin_username"
				/>
				<p
					id="ado-create-err-admin_username"
					class="text-xs text-error mt-1 hidden"
					data-error-for="admin_username"
				></p>
			</div>
			<div class="modal-action">
				<button type="button" id="ado-create-cancel" class="btn">Cancel</button>
				<button type="submit" class="btn btn-primary">Submit for Approval</button>
			</div>
		</form>
	</div>
	<form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
	(function () {
		const form = document.getElementById("ado-create-form");
		const statusBox = document.getElementById("ado-create-status");
		const card = document.getElementById("ado-self-service-card");
		const modal = document.getElementById("ado-create-modal");
		const cancelBtn = document.getElementById("ado-create-cancel");
		if (!form || !statusBox || !card || !modal) return;

		card.addEventListener("click", () => modal.showModal?.());
		cancelBtn?.addEventListener("click", () => modal.close?.());

		// Auto-open from the banner's Quick Actions → "New automation request".
		// Consume the flag so a later refresh doesn't re-open the modal.
		try {
			const params = new URLSearchParams(window.location.search);
			if (params.get("new") === "1") {
				modal.showModal?.();
				params.delete("new");
				const qs = params.toString();
				const clean = window.location.pathname + (qs ? "?" + qs : "");
				window.history.replaceState({}, "", clean);
			}
		} catch (_) { /* silent — nav param is best-effort UX */ }

		// ── Inline validation ─────────────────────────────────────────────
		// Rules mirror backend checks in backend/app/api/approvals.py so
		// users see the same constraints the server enforces without a
		// round-trip. `errorFor` toggles per-field error text instead of
		// dumping everything into the single statusBox at the bottom.
		const projectInput = form.querySelector('[name="project_name"]');
		const adminInput = form.querySelector('[name="admin_username"]');
		const PROJECT_RE = /^[A-Za-z0-9][A-Za-z0-9 _\-.]{1,62}$/;
		const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

		function errorFor(field, msg) {
			const el = form.querySelector(`[data-error-for="${field}"]`);
			const input = form.querySelector(`[name="${field}"]`);
			if (!el || !input) return;
			if (msg) {
				el.textContent = msg;
				el.classList.remove("hidden");
				input.classList.add("input-error");
			} else {
				el.textContent = "";
				el.classList.add("hidden");
				input.classList.remove("input-error");
			}
		}

		function validateProject(value) {
			const v = String(value || "").trim();
			if (!v) return "Project name is required.";
			if (!PROJECT_RE.test(v))
				return "Use 2–63 characters: start with a letter or digit, then letters, digits, spaces, hyphens, underscores, or dots.";
			return "";
		}
		function validateAdmin(value) {
			const v = String(value || "").trim();
			if (!v) return "Admin email is required.";
			if (!EMAIL_RE.test(v)) return "Enter a valid email address.";
			return "";
		}

		projectInput?.addEventListener("input", () =>
			errorFor("project_name", validateProject(projectInput.value))
		);
		projectInput?.addEventListener("blur", () =>
			errorFor("project_name", validateProject(projectInput.value))
		);
		adminInput?.addEventListener("input", () =>
			errorFor("admin_username", validateAdmin(adminInput.value))
		);
		adminInput?.addEventListener("blur", () =>
			errorFor("admin_username", validateAdmin(adminInput.value))
		);

		form.addEventListener("submit", async function (e) {
			e.preventDefault();
			const data = new FormData(form);
			const projectName = String(data.get("project_name") || "").trim();
			const processType = String(data.get("process_type") || "Scrum").trim();
			const adminUser = String(data.get("admin_username") || "").trim();

			const projErr = validateProject(projectName);
			const adminErr = validateAdmin(adminUser);
			errorFor("project_name", projErr);
			errorFor("admin_username", adminErr);
			if (projErr || adminErr) {
				(projErr ? projectInput : adminInput)?.focus();
				return;
			}

			statusBox.textContent = "Submitting request…";
			statusBox.className = "text-sm mt-5 text-base-content/60";

			try {
				const res = await fetch("/api/approvals/requests", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					credentials: "same-origin",
					body: JSON.stringify({
						request_type: "ADO_PROJECT_CREATE",
						request_title: `Azure DevOps project: ${projectName}`,
						request_payload: {
							project_name: projectName,
							process_type: processType,
							admin_username: adminUser,
						},
					}),
				});
				if (!res.ok) {
					const json = await res.json().catch(() => ({}));
					const detail = json?.detail || "Failed to submit request.";
					statusBox.textContent = detail;
					statusBox.className = "text-sm mt-5 text-error";
					window.portalToast?.({ kind: "error", message: detail });
					return;
				}
				modal.close?.();
				form.reset();
				errorFor("project_name", "");
				errorFor("admin_username", "");
				statusBox.innerHTML = `Your request has been submitted and is awaiting admin approval. Track it on the <a class="link" href="/ui/my-requests">My Requests</a> page.`;
				statusBox.className = "text-sm mt-5 text-success";
				window.portalToast?.({
					kind: "success",
					message: "Request submitted for admin approval.",
				});
			} catch (_err) {
				statusBox.textContent = "Could not submit request. Please try again.";
				statusBox.className = "text-sm mt-5 text-error";
				window.portalToast?.({
					kind: "error",
					message: "Could not submit request. Please try again.",
				});
			}
		});
	})();
</script>
