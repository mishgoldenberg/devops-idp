<div class="page-shell">
	<header class="page-header">
		<div>
			<h1 class="page-title">Automations</h1>
			<p class="page-subtitle">Automation workflows and processes</p>
		</div>
		<button id="refresh-btn" class="btn btn-outline btn-sm">
			&#8635; Refresh
		</button>
	</header>

	<div class="page-content">
		<div class="max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
			<button id="ado-self-service-card" class="section-card-interactive text-left">
				<div class="card-body">
					<h3 class="card-title">Azure DevOps Project Creation</h3>
					<p class="text-sm text-base-content/60">Self-service flow with prompt and confirmation before execution.</p>
				</div>
			</button>
		</div>
		<div id="ado-create-status" class="text-sm mt-5"></div>
	</div>
</div>

<dialog id="ado-create-modal" class="modal">
	<div class="modal-box">
		<h3 class="font-bold text-lg">Azure DevOps Project Creation</h3>
		<form id="ado-create-form" class="grid grid-cols-1 gap-3 mt-3">
			<input class="input input-bordered" type="text" name="project_name" placeholder="Project name" required />
			<select class="select select-bordered" name="process_type">
				<option>Scrum</option>
				<option>Agile</option>
				<option>CMMI</option>
				<option>Basic</option>
			</select>
			<input class="input input-bordered" type="text" name="admin_username" placeholder="Admin email" required />
			<div class="modal-action">
				<button type="button" id="ado-create-cancel" class="btn">Cancel</button>
				<button type="submit" class="btn btn-primary">Continue</button>
			</div>
		</form>
	</div>
</dialog>

<script>
	(function () {
		const form = document.getElementById("ado-create-form");
		const statusBox = document.getElementById("ado-create-status");
		const card = document.getElementById("ado-self-service-card");
		const modal = document.getElementById("ado-create-modal");
		const cancelBtn = document.getElementById("ado-create-cancel");

		async function poll(jobId) {
			while (true) {
				const res = await fetch("/ui/automations/azure-devops/status/" + encodeURIComponent(jobId));
				const json = await res.json();
				const data = json?.data || {};
				statusBox.textContent = "Job status: " + (data.status || "pending");
				if (data.status === "succeeded") {
					statusBox.innerHTML = 'Job succeeded. <a class="link" target="_blank" href="' + data.project_url + '">Open project</a>';
					return;
				}
				if (data.status === "failed") {
					statusBox.textContent = "Job failed: " + (data.error || "Unknown error");
					return;
				}
				await new Promise((r) => setTimeout(r, 3000));
			}
		}

		card?.addEventListener("click", () => modal?.showModal());
		cancelBtn?.addEventListener("click", () => modal?.close());

		form?.addEventListener("submit", async function (e) {
			e.preventDefault();
			if (!confirm("Confirm starting the Azure DevOps self-service process?")) return;
			statusBox.textContent = "Submitting automation job...";
			const body = new FormData(form);
			const res = await fetch("/ui/automations/azure-devops/create", { method: "POST", body });
			const json = await res.json();
			if (!json?.success) {
				statusBox.textContent = "Submission failed.";
				return;
			}
			if (modal?.close) modal.close();
			const jobId = json?.data?.job_id;
			if (!jobId) {
				statusBox.textContent = "No job id returned.";
				return;
			}
			statusBox.textContent = "Job created: " + jobId;
			poll(jobId);
		});
	})();
</script>
