<div class="flex-1 min-h-0 flex flex-col overflow-hidden bg-base-200">
	<!-- Page Header -->
	<header
		class="bg-base-100 border-b border-base-300 px-8 py-8 flex items-center justify-between"
	>
		<div>
			<h1 class="text-3xl font-bold text-base-content">Automations</h1>
			<p class="text-base-content/60">Automation workflows and processes</p>
		</div>
		<button id="refresh-btn" class="btn btn-outline btn-sm">
			&#8635; Refresh
		</button>
	</header>

	<!-- Scrollable Content Area -->
	<div class="flex-1 min-h-0 overflow-y-auto p-8">
		<div class="max-w-3xl">
			<div class="card bg-base-100 border border-base-300 shadow">
				<div class="card-body gap-5">
					<h3 class="card-title">Azure DevOps Project Creation</h3>
					<p class="text-sm text-base-content/60">
						Create a new Azure DevOps project using the existing backend automation job.
					</p>
					<form id="ado-create-form" class="grid grid-cols-1 md:grid-cols-3 gap-3">
						<input
							class="input input-bordered"
							type="text"
							name="project_name"
							placeholder="Project name"
							required
						/>
						<select class="select select-bordered" name="process_type">
							<option>Scrum</option>
							<option>Agile</option>
							<option>CMMI</option>
							<option>Basic</option>
						</select>
						<input
							class="input input-bordered"
							type="text"
							name="admin_username"
							placeholder="Admin email"
							required
						/>
						<div class="md:col-span-3 flex justify-end">
							<button type="submit" class="btn btn-primary">Create Project</button>
						</div>
					</form>
					<div id="ado-create-status" class="text-sm"></div>
				</div>
			</div>
		</div>
	</div>
</div>
<script>
	(function () {
		const form = document.getElementById("ado-create-form");
		const statusBox = document.getElementById("ado-create-status");

		async function poll(jobId) {
			while (true) {
				const res = await fetch("/ui/automations/azure-devops/status/" + encodeURIComponent(jobId));
				const json = await res.json();
				const data = json?.data || {};
				statusBox.textContent = "Job status: " + (data.status || "pending");
				if (data.status === "succeeded") {
					statusBox.innerHTML = 'Job succeeded. <a class="link" target="_blank" href="' + data.project_url + '">Open project</a>';
					return;
				}
				if (data.status === "failed") {
					statusBox.textContent = "Job failed: " + (data.error || "Unknown error");
					return;
				}
				await new Promise((r) => setTimeout(r, 3000));
			}
		}

		form?.addEventListener("submit", async function (e) {
			e.preventDefault();
			statusBox.textContent = "Submitting automation job...";
			const body = new FormData(form);
			const res = await fetch("/ui/automations/azure-devops/create", { method: "POST", body });
			const json = await res.json();
			if (!json?.success) {
				statusBox.textContent = "Submission failed.";
				return;
			}
			const jobId = json?.data?.job_id;
			if (!jobId) {
				statusBox.textContent = "No job id returned.";
				return;
			}
			statusBox.textContent = "Job created: " + jobId;
			poll(jobId);
		});
	})();
</script>
