<div class="section-card h-full flex flex-col" data-sonar-projects-root>
	<div class="card-body p-5 flex flex-col h-full gap-3">
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-warning/30 bg-warning/10"
			>
				<svg viewBox="0 0 24 24" class="h-5 w-5 fill-current text-warning" aria-hidden="true">
					<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
				</svg>
			</div>
			<div>
				<h3 class="text-sm font-bold uppercase tracking-widest text-base-content/70">
					SonarQube Projects
				</h3>
				<p class="text-xs text-base-content/50">Live project metrics on hover</p>
			</div>
		</div>

		<div class="hidden items-center gap-2" data-sonar-controls>
			<input
				type="search"
				class="input input-bordered input-sm w-full"
				placeholder="Search projects..."
				data-sonar-search
			/>
			<button type="button" class="btn btn-ghost btn-sm" data-sonar-retry>Retry</button>
		</div>

		<div class="flex-1 min-h-0 relative">
			<div class="h-full flex items-center justify-center text-xs text-base-content/50" data-sonar-status>
				<span class="loading loading-spinner loading-sm text-base-content/30"></span>
			</div>
			<ul
				class="hidden h-full overflow-y-auto overscroll-contain flex-col gap-2 pr-1"
				data-sonar-list
			></ul>
			<div
				class="hidden absolute right-2 top-2 z-10 w-96 max-w-[calc(100%-1rem)] origin-top-right rounded-xl border border-base-300 bg-base-100 p-4 shadow-xl opacity-0 scale-95 translate-y-1 transform transition-all duration-150 ease-out"
				data-sonar-panel
			></div>
		</div>
	</div>
</div>

<script>
	(function () {
		const root = document.querySelector("[data-sonar-projects-root]");
		if (!root) return;
		const listEl = root.querySelector("[data-sonar-list]");
		const statusEl = root.querySelector("[data-sonar-status]");
		const panelEl = root.querySelector("[data-sonar-panel]");
		const searchEl = root.querySelector("[data-sonar-search]");
		const retryBtn = root.querySelector("[data-sonar-retry]");
		const controlsEl = root.querySelector("[data-sonar-controls]");
		const detailsCache = new Map();
		let allProjects = [];
		let searchTimer = null;
		let panelTimer = null;

		function scheduleHidePanel() {
			clearTimeout(panelTimer);
			panelTimer = setTimeout(hidePanel, 180);
		}

		function showPanel() {
			panelEl.classList.remove("hidden");
			requestAnimationFrame(() => {
				panelEl.classList.remove("opacity-0", "scale-95", "translate-y-1");
				panelEl.classList.add("opacity-100", "scale-100", "translate-y-0");
			});
		}

		function hidePanel() {
			panelEl.classList.remove("opacity-100", "scale-100", "translate-y-0");
			panelEl.classList.add("opacity-0", "scale-95", "translate-y-1");
			setTimeout(() => {
				if (panelEl.classList.contains("opacity-0")) panelEl.classList.add("hidden");
			}, 160);
		}

		function escapeHtml(value) {
			return String(value == null ? "" : value)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#39;");
		}

		function showStatus(message) {
			controlsEl?.classList.add("hidden");
			controlsEl?.classList.remove("flex");
			statusEl.classList.remove("hidden");
			statusEl.classList.remove("block", "text-base-content");
			statusEl.classList.add("h-full", "items-center", "justify-center", "text-base-content/50");
			statusEl.classList.add("flex");
			statusEl.innerHTML = message;
			listEl.classList.add("hidden");
		}

		function connectPrompt() {
			controlsEl?.classList.add("hidden");
			controlsEl?.classList.remove("flex");
			statusEl.classList.remove("hidden");
			statusEl.classList.remove("flex", "h-full", "items-center", "justify-center", "text-base-content/50");
			statusEl.classList.add("block", "text-base-content");
			statusEl.innerHTML = `
				<div class="w-full rounded-xl border border-primary/30 bg-primary/5 p-4 text-left opacity-100 scale-100 translate-y-0 transform transition-all duration-150 ease-out">
					<h4 class="font-semibold text-sm text-base-content">Connect to SonarQube</h4>
					<p class="mt-1 text-xs text-base-content/60">Generate a User Token in your profile → Security</p>
					<input data-sonar-token type="password" class="input input-bordered input-sm mt-3 w-full" placeholder="Paste SonarQube User Token" />
					<div class="mt-3 flex gap-2">
						<button type="button" class="btn btn-primary btn-xs" data-sonar-save-token>Save</button>
						<button type="button" class="btn btn-ghost btn-xs" data-sonar-cancel-token>Cancel</button>
					</div>
				</div>
			`;
			listEl.classList.add("hidden");
		}

		function showList() {
			controlsEl?.classList.remove("hidden");
			controlsEl?.classList.add("flex");
			statusEl.classList.remove("block", "text-base-content");
			statusEl.classList.add("h-full", "items-center", "justify-center", "text-base-content/50");
			statusEl.classList.add("hidden");
			listEl.classList.remove("hidden");
			listEl.classList.add("flex");
		}

		function showEmpty(message) {
			controlsEl?.classList.remove("hidden");
			controlsEl?.classList.add("flex");
			statusEl.classList.remove("hidden");
			statusEl.classList.remove("block", "text-base-content");
			statusEl.classList.add("h-full", "items-center", "justify-center", "text-base-content/50");
			statusEl.classList.add("flex");
			statusEl.innerHTML = message;
			listEl.classList.add("hidden");
		}

		function currentFilter() {
			return (searchEl?.value || "").trim().toLowerCase();
		}

		function filteredProjects() {
			const q = currentFilter();
			if (!q) return allProjects;
			return allProjects.filter((p) => `${p.name || ""} ${p.project_key || p.key || ""}`.toLowerCase().includes(q));
		}

		function render(projects) {
			if (!projects.length) {
				showEmpty('<span class="text-base-content/50">No projects found</span>');
				return;
			}
			listEl.innerHTML = projects.map((p) => {
				const key = escapeHtml(p.project_key || p.key || "");
				const name = escapeHtml(p.name || key);
				const lang = escapeHtml(p.language || "Unknown");
				const branch = escapeHtml(p.main_branch || "main");
				const pinned = !!p.pinned;
				return `
					<li
						class="rounded-lg border border-base-300 bg-base-200/60 px-3 py-2.5 transition hover:border-warning/50 hover:bg-base-200"
						data-sonar-project="${key}"
						data-sonar-project-name="${name}"
					>
						<div class="flex items-center justify-between gap-2">
							<span class="text-sm font-semibold truncate">${name}</span>
							<div class="flex items-center gap-1">
								${pinned ? '<span class="badge badge-warning badge-xs">Pinned</span>' : ""}
								<button type="button" class="btn btn-ghost btn-xs px-1" title="${pinned ? "Unpin" : "Pin"}" data-sonar-pin="${key}" data-pinned="${pinned ? "1" : "0"}">${pinned ? "★" : "☆"}</button>
								<span class="badge badge-outline badge-xs">${lang}</span>
							</div>
						</div>
						<div class="mt-1 flex items-center gap-2 text-xs text-base-content/50">
							<span>${key}</span>
							<span class="ml-auto">branch: ${branch}</span>
						</div>
					</li>`;
			}).join("");
			showList();
		}

		function renderPanel(details, anchor) {
			const rect = anchor.getBoundingClientRect();
			const rootRect = root.getBoundingClientRect();
			panelEl.style.top = `${Math.max(8, rect.top - rootRect.top)}px`;
			panelEl.innerHTML = `
				<div class="flex items-start justify-between gap-2">
					<div>
						<p class="text-sm font-semibold">${escapeHtml(details.name || details.project_key)}</p>
						<p class="text-xs text-base-content/50">${escapeHtml(details.project_key || "")}</p>
					</div>
					<span class="badge badge-warning badge-sm">${escapeHtml(details.language || "")}</span>
				</div>
				<div class="mt-3 grid grid-cols-2 gap-2 text-xs">
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-error font-bold">${escapeHtml(details.bugs)}</span> bugs</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-warning font-bold">${escapeHtml(details.vulnerabilities)}</span> vulns</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-info font-bold">${escapeHtml(details.code_smells)}</span> code smells</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-success font-bold">${escapeHtml(details.coverage)}%</span> coverage</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="font-bold">${escapeHtml(details.duplications)}%</span> duplicate</div>
				</div>
				<div class="mt-3 flex items-center gap-2 text-xs">
					<span class="text-base-content/50">Lines of code</span>
					<span class="ml-auto font-semibold">${Number(details.lines_of_code || 0).toLocaleString()}</span>
				</div>
				<label class="label py-1 mt-2"><span class="label-text text-xs">Branch</span></label>
				<select class="select select-bordered select-xs w-full">
					${(details.branches || ["main", "dev"]).map((b) => `<option ${b === details.main_branch ? "selected" : ""}>${escapeHtml(b)}</option>`).join("")}
				</select>
			`;
			showPanel();
		}

		async function loadDetails(key, anchor) {
			if (detailsCache.has(key)) {
				renderPanel(detailsCache.get(key), anchor);
				return;
			}
			panelEl.innerHTML = '<div class="flex items-center gap-2 text-xs text-base-content/50"><span class="loading loading-spinner loading-xs"></span> Loading details…</div>';
			showPanel();
			const res = await fetch(`/api/integrations/sonarqube/project-details?project_key=${encodeURIComponent(key)}`, { credentials: "same-origin" });
			if (!res.ok) throw new Error("http " + res.status);
			const body = await res.json();
			const details = body && body.data ? body.data : {};
			detailsCache.set(key, details);
			renderPanel(details, anchor);
		}

		listEl.addEventListener("click", async (e) => {
			const pinBtn = e.target.closest("[data-sonar-pin]");
			if (!pinBtn) return;
			e.preventDefault();
			e.stopPropagation();
			const itemId = pinBtn.dataset.sonarPin;
			const row = pinBtn.closest("[data-sonar-project]");
			const itemName = row?.dataset.sonarProjectName || itemId;
			const pinned = pinBtn.dataset.pinned === "1";
			try {
				const res = await fetch("/api/integrations/sonarqube/pins", {
					method: pinned ? "DELETE" : "POST",
					credentials: "same-origin",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ item_id: itemId, item_name: itemName }),
				});
				if (!res.ok) throw new Error("pin");
				allProjects = allProjects.map((p) => ((p.project_key || p.key) === itemId ? { ...p, pinned: !pinned } : p));
				allProjects.sort((a, b) => (Number(!a.pinned) - Number(!b.pinned)) || String(a.name || "").localeCompare(String(b.name || "")));
				render(filteredProjects());
			} catch {
				window.portalToast?.({ kind: "error", message: "Could not update pin." });
			}
		});

		listEl.addEventListener("mouseover", (e) => {
			const row = e.target.closest("[data-sonar-project]");
			if (!row) return;
			clearTimeout(panelTimer);
			loadDetails(row.dataset.sonarProject, row).catch(() => {
				panelEl.innerHTML = '<p class="text-xs text-error">Could not load details.</p>';
				showPanel();
			});
		});

		listEl.addEventListener("mouseleave", () => {
			scheduleHidePanel();
		});

		panelEl.addEventListener("mouseenter", () => clearTimeout(panelTimer));
		panelEl.addEventListener("mouseleave", scheduleHidePanel);

		statusEl.addEventListener("click", async (e) => {
			const saveBtn = e.target.closest("[data-sonar-save-token]");
			const cancelBtn = e.target.closest("[data-sonar-cancel-token]");
			if (cancelBtn) {
				showStatus('<span class="text-base-content/50">Connection required</span>');
				return;
			}
			if (!saveBtn) return;
			const input = statusEl.querySelector("[data-sonar-token]");
			const token = (input?.value || "").trim();
			if (!token) return;
			saveBtn.disabled = true;
			try {
				const res = await fetch("/api/integrations/sonarqube/token", {
					method: "POST",
					credentials: "same-origin",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ token }),
				});
				if (!res.ok) throw new Error("Invalid token");
				if (input) input.value = "";
				window.portalToast?.({ kind: "success", message: "SonarQube connected." });
				loadProjects();
			} catch {
				window.portalToast?.({ kind: "error", message: "Invalid token or connection failed" });
			} finally {
				saveBtn.disabled = false;
			}
		});

		function loadProjects() {
			showStatus('<span class="loading loading-spinner loading-sm text-base-content/30"></span>');
			fetch("/api/integrations/sonarqube/projects", { credentials: "same-origin" })
				.then((res) => {
					if (res.status === 428) {
						connectPrompt();
						return null;
					}
					if (!res.ok) throw new Error("http " + res.status);
					return res.json();
				})
				.then((body) => {
					if (!body) return;
					allProjects = Array.isArray(body && body.data) ? body.data : [];
					render(filteredProjects());
				})
				.catch(() => showStatus('<span class="text-error">Invalid token or connection failed</span>'));
		}

		searchEl?.addEventListener("input", () => {
			clearTimeout(searchTimer);
			searchTimer = setTimeout(() => render(filteredProjects()), 300);
		});
		retryBtn?.addEventListener("click", loadProjects);
		loadProjects();
	})();
</script>
