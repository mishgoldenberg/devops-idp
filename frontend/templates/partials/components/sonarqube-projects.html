<div class="section-card h-full flex flex-col" data-sonar-projects-root>
	<div class="card-body p-5 flex flex-col h-full gap-3">
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-warning/30 bg-warning/10"
			>
				<svg viewBox="0 0 24 24" class="h-5 w-5 fill-current text-warning" aria-hidden="true">
					<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
				</svg>
			</div>
			<div>
				<h3 class="text-sm font-bold uppercase tracking-widest text-base-content/70">
					SonarQube Projects
				</h3>
				<p class="text-xs text-base-content/50">Mocked project metrics on hover</p>
			</div>
		</div>

		<div class="flex-1 min-h-0 relative">
			<div class="h-full flex items-center justify-center text-xs text-base-content/50" data-sonar-status>
				<span class="loading loading-spinner loading-sm text-base-content/30"></span>
			</div>
			<ul
				class="hidden h-full overflow-y-auto overscroll-contain flex-col gap-2 pr-1"
				data-sonar-list
			></ul>
			<div
				class="hidden absolute right-2 top-2 z-10 w-72 rounded-xl border border-base-300 bg-base-100 p-4 shadow-xl transition-opacity"
				data-sonar-panel
			></div>
		</div>
	</div>
</div>

<script>
	(function () {
		const root = document.querySelector("[data-sonar-projects-root]");
		if (!root) return;
		const listEl = root.querySelector("[data-sonar-list]");
		const statusEl = root.querySelector("[data-sonar-status]");
		const panelEl = root.querySelector("[data-sonar-panel]");
		const detailsCache = new Map();
		let panelTimer = null;

		function escapeHtml(value) {
			return String(value == null ? "" : value)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#39;");
		}

		function showStatus(message) {
			statusEl.classList.remove("hidden");
			statusEl.classList.add("flex");
			statusEl.innerHTML = message;
			listEl.classList.add("hidden");
		}

		function showList() {
			statusEl.classList.add("hidden");
			listEl.classList.remove("hidden");
			listEl.classList.add("flex");
		}

		function render(projects) {
			if (!projects.length) {
				showStatus('<span class="text-base-content/50">No data available</span>');
				return;
			}
			listEl.innerHTML = projects.map((p) => {
				const key = escapeHtml(p.project_key || p.key || "");
				const name = escapeHtml(p.name || key);
				const lang = escapeHtml(p.language || "Unknown");
				const branch = escapeHtml(p.main_branch || "main");
				return `
					<li
						class="rounded-lg border border-base-300 bg-base-200/60 px-3 py-2.5 transition hover:border-warning/50 hover:bg-base-200"
						data-sonar-project="${key}"
					>
						<div class="flex items-center justify-between gap-2">
							<span class="text-sm font-semibold truncate">${name}</span>
							<span class="badge badge-outline badge-xs">${lang}</span>
						</div>
						<div class="mt-1 flex items-center gap-2 text-xs text-base-content/50">
							<span>${key}</span>
							<span class="ml-auto">branch: ${branch}</span>
						</div>
					</li>`;
			}).join("");
			showList();
		}

		function renderPanel(details, anchor) {
			const rect = anchor.getBoundingClientRect();
			const rootRect = root.getBoundingClientRect();
			panelEl.style.top = `${Math.max(8, rect.top - rootRect.top)}px`;
			panelEl.innerHTML = `
				<div class="flex items-start justify-between gap-2">
					<div>
						<p class="text-sm font-semibold">${escapeHtml(details.name || details.project_key)}</p>
						<p class="text-xs text-base-content/50">${escapeHtml(details.project_key || "")}</p>
					</div>
					<span class="badge badge-warning badge-sm">${escapeHtml(details.language || "")}</span>
				</div>
				<div class="mt-3 grid grid-cols-2 gap-2 text-xs">
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-error font-bold">${escapeHtml(details.bugs)}</span> bugs</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-warning font-bold">${escapeHtml(details.vulnerabilities)}</span> vulns</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="text-success font-bold">${escapeHtml(details.coverage)}%</span> coverage</div>
					<div class="rounded-lg bg-base-200 px-2 py-1.5"><span class="font-bold">${escapeHtml(details.duplications)}%</span> duplicate</div>
				</div>
				<div class="mt-3 flex items-center gap-2 text-xs">
					<span class="text-base-content/50">Lines of code</span>
					<span class="ml-auto font-semibold">${Number(details.lines_of_code || 0).toLocaleString()}</span>
				</div>
				<label class="label py-1 mt-2"><span class="label-text text-xs">Branch</span></label>
				<select class="select select-bordered select-xs w-full">
					${(details.branches || ["main", "dev"]).map((b) => `<option ${b === details.main_branch ? "selected" : ""}>${escapeHtml(b)}</option>`).join("")}
				</select>
			`;
			panelEl.classList.remove("hidden");
		}

		async function loadDetails(key, anchor) {
			if (detailsCache.has(key)) {
				renderPanel(detailsCache.get(key), anchor);
				return;
			}
			panelEl.innerHTML = '<div class="flex items-center gap-2 text-xs text-base-content/50"><span class="loading loading-spinner loading-xs"></span> Loading details…</div>';
			panelEl.classList.remove("hidden");
			const res = await fetch(`/api/sonarqube/project-details?project_key=${encodeURIComponent(key)}`, { credentials: "same-origin" });
			if (!res.ok) throw new Error("http " + res.status);
			const body = await res.json();
			const details = body && body.data ? body.data : {};
			detailsCache.set(key, details);
			renderPanel(details, anchor);
		}

		listEl.addEventListener("mouseover", (e) => {
			const row = e.target.closest("[data-sonar-project]");
			if (!row) return;
			clearTimeout(panelTimer);
			loadDetails(row.dataset.sonarProject, row).catch(() => {
				panelEl.innerHTML = '<p class="text-xs text-error">Could not load details.</p>';
				panelEl.classList.remove("hidden");
			});
		});

		listEl.addEventListener("mouseleave", () => {
			panelTimer = setTimeout(() => panelEl.classList.add("hidden"), 120);
		});

		fetch("/api/sonarqube/projects", { credentials: "same-origin" })
			.then((res) => {
				if (!res.ok) throw new Error("http " + res.status);
				return res.json();
			})
			.then((body) => render(Array.isArray(body && body.data) ? body.data : []))
			.catch(() => showStatus('<span class="text-base-content/50">No data available</span>'));
	})();
</script>
