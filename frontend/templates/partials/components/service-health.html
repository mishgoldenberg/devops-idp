<div
	class="section-card h-full flex flex-col"
>
	<div class="card-body p-5 flex flex-col h-full gap-4">
		<!-- Header -->
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-success/30 bg-success/10"
			>
				<svg
					viewBox="0 0 24 24"
					class="h-5 w-5 fill-current text-success"
					aria-hidden="true"
				>
					<path
						d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"
					/>
				</svg>
			</div>
			<h3
				class="text-sm font-bold uppercase tracking-widest text-base-content/70"
			>
				Service Health
			</h3>
		</div>
		<!-- 2-column service status grid -->
		{% if not services %}
		<div class="flex flex-1 flex-col items-center justify-center text-center gap-2 py-8 text-base-content/60">
			<svg class="w-10 h-10 text-base-content/30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<circle cx="12" cy="12" r="9"></circle>
				<path d="M12 8v5"></path>
				<circle cx="12" cy="16.5" r="0.75" fill="currentColor"></circle>
			</svg>
			<p class="text-sm font-medium">No services monitored</p>
			<p class="text-xs text-base-content/50 max-w-xs">
				Health checks will appear here once services report status.
			</p>
		</div>
		{% else %}
		<div class="grid grid-cols-2 gap-2 flex-1">
			{% for svc in services %}
			<div
				class="rounded-lg bg-base-200/60 border border-base-300 px-3 py-2.5 flex items-center gap-2.5"
			>
				<span
					class="h-2.5 w-2.5 shrink-0 rounded-full {{ 'bg-success' if svc.status == 'healthy' else 'bg-error' }}"
				></span>
				<div class="flex flex-col min-w-0">
					<span class="text-xs font-semibold text-base-content truncate"
						>{{ svc.name }}</span
					>
					<span
						class="text-xs {{ 'text-success/80' if svc.status == 'healthy' else 'text-error/80' }}"
						>{{ 'Up' if svc.status == 'healthy' else 'Down' }}</span
					>
				</div>
			</div>
			{% endfor %}
		</div>
		{% endif %}
	</div>
</div>
