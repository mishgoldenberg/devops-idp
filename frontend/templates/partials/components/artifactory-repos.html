<div class="section-card h-full flex flex-col" data-arti-repos-root>
	<div class="card-body p-5 flex flex-col h-full gap-3">
		<div class="flex items-center gap-3">
			<div
				class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-info/30 bg-info/10"
			>
				<svg viewBox="0 0 24 24" class="h-5 w-5 fill-current text-info" aria-hidden="true">
					<path d="M3 3h18a1 1 0 011 1v3a1 1 0 01-1 1h-1v11a1 1 0 01-1 1H5a1 1 0 01-1-1V8H3a1 1 0 01-1-1V4a1 1 0 011-1zm5 8a1 1 0 000 2h8a1 1 0 000-2H8z" />
				</svg>
			</div>
			<div>
				<h3 class="text-sm font-bold uppercase tracking-widest text-base-content/70">
					Artifactory Repos
				</h3>
				<p class="text-xs text-base-content/50">Live latest artifacts on hover</p>
			</div>
		</div>

		<div class="hidden items-center gap-2" data-arti-controls>
			<input
				type="search"
				class="input input-bordered input-sm w-full"
				placeholder="Search repositories..."
				data-arti-search
			/>
			<button type="button" class="btn btn-ghost btn-sm" data-arti-retry>Retry</button>
		</div>

		<div class="flex-1 min-h-0 relative">
			<div class="h-full flex items-center justify-center text-xs text-base-content/50" data-arti-status>
				<span class="loading loading-spinner loading-sm text-base-content/30"></span>
			</div>
			<ul
				class="hidden h-full overflow-y-auto overscroll-contain flex-col gap-2 pr-1"
				data-arti-list
			></ul>
			<div
				class="hidden absolute right-2 top-2 z-10 w-80 origin-top-right rounded-xl border border-base-300 bg-base-100 p-4 shadow-xl opacity-0 scale-95 translate-y-1 transform transition-all duration-150 ease-out"
				data-arti-panel
			></div>
		</div>
	</div>
</div>

<script>
	(function () {
		const root = document.querySelector("[data-arti-repos-root]");
		if (!root) return;
		const listEl = root.querySelector("[data-arti-list]");
		const statusEl = root.querySelector("[data-arti-status]");
		const panelEl = root.querySelector("[data-arti-panel]");
		const searchEl = root.querySelector("[data-arti-search]");
		const retryBtn = root.querySelector("[data-arti-retry]");
		const controlsEl = root.querySelector("[data-arti-controls]");
		const detailsCache = new Map();
		let allRepos = [];
		let searchTimer = null;
		let panelTimer = null;

		function scheduleHidePanel() {
			clearTimeout(panelTimer);
			panelTimer = setTimeout(hidePanel, 180);
		}

		function showPanel() {
			panelEl.classList.remove("hidden");
			requestAnimationFrame(() => {
				panelEl.classList.remove("opacity-0", "scale-95", "translate-y-1");
				panelEl.classList.add("opacity-100", "scale-100", "translate-y-0");
			});
		}

		function hidePanel() {
			panelEl.classList.remove("opacity-100", "scale-100", "translate-y-0");
			panelEl.classList.add("opacity-0", "scale-95", "translate-y-1");
			setTimeout(() => {
				if (panelEl.classList.contains("opacity-0")) panelEl.classList.add("hidden");
			}, 160);
		}

		function escapeHtml(value) {
			return String(value == null ? "" : value)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#39;");
		}

		function timeAgo(iso) {
			const t = Date.parse(iso || "");
			if (isNaN(t)) return "";
			const secs = Math.max(1, Math.floor((Date.now() - t) / 1000));
			if (secs < 3600) return Math.floor(secs / 60) + "m ago";
			if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
			return Math.floor(secs / 86400) + "d ago";
		}

		function showStatus(message) {
			controlsEl?.classList.add("hidden");
			controlsEl?.classList.remove("flex");
			statusEl.classList.remove("hidden");
			statusEl.classList.add("flex");
			statusEl.innerHTML = message;
			listEl.classList.add("hidden");
		}

		function connectPrompt() {
			controlsEl?.classList.add("hidden");
			controlsEl?.classList.remove("flex");
			statusEl.classList.remove("hidden");
			statusEl.classList.add("flex");
			statusEl.innerHTML = `
				<div class="w-full rounded-xl border border-primary/30 bg-primary/5 p-4 text-left opacity-100 scale-100 translate-y-0 transform transition-all duration-150 ease-out">
					<h4 class="font-semibold text-sm">Connect to Artifactory</h4>
					<p class="mt-1 text-xs text-base-content/60">Generate an API Key or Access Token from your profile</p>
					<input data-arti-token type="password" class="input input-bordered input-sm mt-3 w-full" placeholder="Paste API Key or Access Token" />
					<div class="mt-3 flex gap-2">
						<button type="button" class="btn btn-primary btn-xs" data-arti-save-token>Save</button>
						<button type="button" class="btn btn-ghost btn-xs" data-arti-cancel-token>Cancel</button>
					</div>
				</div>
			`;
			listEl.classList.add("hidden");
		}

		function showList() {
			controlsEl?.classList.remove("hidden");
			controlsEl?.classList.add("flex");
			statusEl.classList.add("hidden");
			listEl.classList.remove("hidden");
			listEl.classList.add("flex");
		}

		function showEmpty(message) {
			controlsEl?.classList.remove("hidden");
			controlsEl?.classList.add("flex");
			statusEl.classList.remove("hidden");
			statusEl.classList.add("flex");
			statusEl.innerHTML = message;
			listEl.classList.add("hidden");
		}

		function currentFilter() {
			return (searchEl?.value || "").trim().toLowerCase();
		}

		function filteredRepos() {
			const q = currentFilter();
			if (!q) return allRepos;
			return allRepos.filter((repo) => `${repo.name || ""} ${repo.type || ""} ${repo.description || ""}`.toLowerCase().includes(q));
		}

		function render(repos) {
			if (!repos.length) {
				showEmpty('<span class="text-base-content/50">No repositories found</span>');
				return;
			}
			listEl.innerHTML = repos.map((repo) => `
				<li
					class="rounded-lg border border-base-300 bg-base-200/60 px-3 py-2.5 transition hover:border-info/50 hover:bg-base-200"
					data-repo-name="${escapeHtml(repo.name)}"
				>
					<a href="${escapeHtml(repo.url || "#")}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between gap-2 hover:text-info">
						<span class="text-sm font-semibold truncate">${escapeHtml(repo.name)}</span>
						<span class="flex items-center gap-1">
							${repo.pinned ? '<span class="badge badge-info badge-xs">Pinned</span>' : ""}
							<button type="button" class="btn btn-ghost btn-xs px-1" title="${repo.pinned ? "Unpin" : "Pin"}" data-arti-pin="${escapeHtml(repo.name)}" data-pinned="${repo.pinned ? "1" : "0"}">${repo.pinned ? "★" : "☆"}</button>
							<span class="badge badge-outline badge-xs">${escapeHtml(repo.type)}</span>
						</span>
					</a>
					<p class="mt-1 text-xs text-base-content/50 truncate">${escapeHtml(repo.description || "Mock repository")}</p>
				</li>
			`).join("");
			showList();
		}

		function renderPanel(details, anchor) {
			const rect = anchor.getBoundingClientRect();
			const rootRect = root.getBoundingClientRect();
			panelEl.style.top = `${Math.max(8, rect.top - rootRect.top)}px`;
			const artifacts = Array.isArray(details.artifacts) ? details.artifacts : [];
			panelEl.innerHTML = `
				<div class="flex items-start justify-between gap-2">
					<div>
						<a href="${escapeHtml(details.url || "#")}" target="_blank" rel="noopener noreferrer" class="text-sm font-semibold hover:text-info">${escapeHtml(details.name || "")}</a>
						<p class="text-xs text-base-content/50">Latest artifacts</p>
					</div>
					<span class="badge badge-info badge-sm">${escapeHtml(details.type || "")}</span>
				</div>
				${artifacts.length ? `
					<ul class="mt-3 flex max-h-48 flex-col gap-2 overflow-y-auto pr-1">
						${artifacts.map((a) => `
							<li class="rounded-lg bg-base-200 px-2 py-1.5">
								<a href="${escapeHtml(a.url || "#")}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 hover:text-info">
									<span class="truncate text-xs font-medium">${escapeHtml(a.name)}</span>
									<span class="badge badge-outline badge-xs ml-auto">${escapeHtml(a.type)}</span>
								</a>
								<p class="mt-0.5 text-[10px] text-base-content/50">${escapeHtml(timeAgo(a.last_updated))}</p>
							</li>
						`).join("")}
					</ul>` : '<p class="mt-3 text-xs text-base-content/50">No data available</p>'}
			`;
			showPanel();
		}

		async function loadDetails(repoName, anchor) {
			if (detailsCache.has(repoName)) {
				renderPanel(detailsCache.get(repoName), anchor);
				return;
			}
			panelEl.innerHTML = '<div class="flex items-center gap-2 text-xs text-base-content/50"><span class="loading loading-spinner loading-xs"></span> Loading artifacts…</div>';
			showPanel();
			const res = await fetch(`/api/integrations/artifactory/repo-details?name=${encodeURIComponent(repoName)}`, { credentials: "same-origin" });
			if (!res.ok) throw new Error("http " + res.status);
			const body = await res.json();
			const details = body && body.data ? body.data : {};
			detailsCache.set(repoName, details);
			renderPanel(details, anchor);
		}

		listEl.addEventListener("click", async (e) => {
			const pinBtn = e.target.closest("[data-arti-pin]");
			if (!pinBtn) return;
			e.preventDefault();
			e.stopPropagation();
			const itemId = pinBtn.dataset.artiPin;
			const pinned = pinBtn.dataset.pinned === "1";
			try {
				const res = await fetch("/api/integrations/artifactory/pins", {
					method: pinned ? "DELETE" : "POST",
					credentials: "same-origin",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ item_id: itemId, item_name: itemId }),
				});
				if (!res.ok) throw new Error("pin");
				allRepos = allRepos.map((r) => (r.name === itemId ? { ...r, pinned: !pinned } : r));
				allRepos.sort((a, b) => (Number(!a.pinned) - Number(!b.pinned)) || String(a.name || "").localeCompare(String(b.name || "")));
				render(filteredRepos());
			} catch {
				window.portalToast?.({ kind: "error", message: "Could not update pin." });
			}
		});

		listEl.addEventListener("mouseover", (e) => {
			const row = e.target.closest("[data-repo-name]");
			if (!row) return;
			clearTimeout(panelTimer);
			loadDetails(row.dataset.repoName, row).catch(() => {
				panelEl.innerHTML = '<p class="text-xs text-error">Could not load details.</p>';
				showPanel();
			});
		});

		listEl.addEventListener("mouseleave", () => {
			scheduleHidePanel();
		});

		panelEl.addEventListener("mouseenter", () => clearTimeout(panelTimer));
		panelEl.addEventListener("mouseleave", scheduleHidePanel);

		statusEl.addEventListener("click", async (e) => {
			const saveBtn = e.target.closest("[data-arti-save-token]");
			const cancelBtn = e.target.closest("[data-arti-cancel-token]");
			if (cancelBtn) {
				showStatus('<span class="text-base-content/50">Connection required</span>');
				return;
			}
			if (!saveBtn) return;
			const input = statusEl.querySelector("[data-arti-token]");
			const token = (input?.value || "").trim();
			if (!token) return;
			saveBtn.disabled = true;
			try {
				const res = await fetch("/api/integrations/artifactory/token", {
					method: "POST",
					credentials: "same-origin",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ token }),
				});
				if (!res.ok) throw new Error("Invalid token");
				if (input) input.value = "";
				window.portalToast?.({ kind: "success", message: "Artifactory connected." });
				loadRepos();
			} catch {
				window.portalToast?.({ kind: "error", message: "Invalid token or connection failed" });
			} finally {
				saveBtn.disabled = false;
			}
		});

		function loadRepos() {
			showStatus('<span class="loading loading-spinner loading-sm text-base-content/30"></span>');
			fetch("/api/integrations/artifactory/repos", { credentials: "same-origin" })
				.then((res) => {
					if (res.status === 428) {
						connectPrompt();
						return null;
					}
					if (!res.ok) throw new Error("http " + res.status);
					return res.json();
				})
				.then((body) => {
					if (!body) return;
					allRepos = Array.isArray(body && body.data) ? body.data : [];
					render(filteredRepos());
				})
				.catch(() => showStatus('<span class="text-error">Invalid token or connection failed</span>'));
		}

		searchEl?.addEventListener("input", () => {
			clearTimeout(searchTimer);
			searchTimer = setTimeout(() => render(filteredRepos()), 300);
		});
		retryBtn?.addEventListener("click", loadRepos);
		loadRepos();
	})();
</script>
