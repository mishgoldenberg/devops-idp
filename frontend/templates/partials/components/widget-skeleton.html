{#
	Reusable skeleton placeholder for dashboard widgets.
	Replaces loading spinners so the page doesn't visibly "jump" while data
	loads — the rough card shape shows up instantly.
#}
<div class="widget-skeleton" aria-hidden="true" role="presentation">
	<div class="card-body">
		<div class="sk-line h-4 w-1/2"></div>
		<div class="sk-line h-3 w-full"></div>
		<div class="sk-line h-3 w-11/12"></div>
		<div class="sk-line h-3 w-10/12"></div>
		<div class="sk-line h-3 w-9/12"></div>
		<div class="flex items-center justify-between pt-2">
			<div class="sk-line h-3 w-1/3"></div>
			<div class="sk-line h-6 w-20 rounded-md"></div>
		</div>
	</div>
</div>
