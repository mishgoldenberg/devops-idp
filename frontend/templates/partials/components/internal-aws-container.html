<div class="page-shell">
	<header class="page-header">
		<div>
			<h1 class="page-title">Internal AWS</h1>
			<p class="page-subtitle">AWS infrastructure and resources</p>
		</div>
		<div class="flex items-center gap-2">
			{% with system_key = 'internal_aws' %}
				{% include "partials/components/open-system-button.html" %}
			{% endwith %}
			<button id="refresh-btn" class="btn btn-outline btn-sm">
				&#8635; Refresh
			</button>
		</div>
	</header>

	<div class="flex-1 min-h-0 overflow-y-auto flex items-center justify-center p-6">
		<div class="empty-state max-w-md">
			<svg
				class="w-16 h-16 text-base-300"
				fill="none"
				stroke="currentColor"
				viewBox="0 0 24 24"
				aria-hidden="true"
			>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="1.5"
					d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"
				/>
			</svg>
			<h3 class="text-lg font-semibold text-base-content">
				No components configured
			</h3>
			<p class="text-base-content/60">
				This page is currently empty. Components will appear here when they're
				configured.
			</p>
		</div>
	</div>
</div>
