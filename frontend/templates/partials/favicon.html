{#
	The tab icon, in one place for every page. The SVG is the one browsers pick;
	the PNGs and the Apple icon cover the ones that do not take SVG. The small
	variant draws the mark larger in its tile, because at 16px the regular one
	is a blue square with a speck in it.
#}
<link rel="icon" href="/static/images/favicon-small.svg" type="image/svg+xml" />
<link rel="icon" href="/static/images/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/static/images/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png" />
