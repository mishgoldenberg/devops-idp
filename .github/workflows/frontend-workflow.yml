name: Docker Frontend CI

on:
  push:
    paths:
      - "frontend/**"

jobs:
  frontend:
    uses: ./.github/workflows/template-workflow.yml
    with:
      service_path: frontend
      image_name: frontend
      gcp_project: devops-idp-489012
      gcp_region: europe-west1
      repository_name: devops-idp
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}