name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/app/requirements.txt

      # Everything below is pure Python on purpose: no Node, no network, no
      # cluster. Each of these was written after something reached production
      # that one of them would have caught.

      - name: Every name resolves, every template parses
        run: python scripts/check_imports.py

      - name: No template uses a CSS class that is not compiled
        run: python scripts/check_css_classes.py

      - name: Every inline script block is valid JavaScript
        run: python scripts/check_inline_js.py

      - name: Both copies of the nginx config agree
        run: python scripts/check_nginx_sync.py

      - name: The requester section is defined once and reused
        run: python scripts/check_requester_fields.py

      - name: The changelog is present and written for users
        run: python scripts/check_changelog.py

      - name: No dead or duplicated code
        run: python scripts/check_code_hygiene.py

      - name: Outbound calls, error messages and secrets follow the rules
        run: python scripts/check_security_rules.py

      - name: Everything compiles
        run: python -m compileall -q backend/app scripts

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # A throwaway database that exists only for this job, so every query the
    # modules send is run against a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://hub:ci-only@localhost:5432/hub
      JWT_SECRET: ci-only-signing-key-that-signs-nothing-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/app/requirements.txt pytest

      - name: Run the tests
        working-directory: backend
        run: python -m pytest tests -q

  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The closed network cannot reach a vulnerability database; this job can,
      # on every push, against the same pins the image installs.
      - name: Audit the pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/app/requirements.txt
