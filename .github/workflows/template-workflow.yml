name: Service Template

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      image_name:
        required: true
        type: string
      gcp_project:
        required: true
        type: string
      gcp_region:
        required: true
        type: string
      # GKE cluster details for automatic rollout
      gke_cluster:
        required: false
        type: string
        default: devops-idp-cluster
      k8s_namespace:
        required: false
        type: string
        default: devops-control-center-dev
    secrets:
      GCP_SA_KEY:
        required: true
      POSTGRES_PASSWORD:
        required: false
      REDIS_PASSWORD:
        required: false
      JWT_SECRET:
        required: false
      OAUTH_CLIENT_SECRET:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      AZURE_DEVOPS_PAT:
        required: false
      AZURE_DEVOPS_ADMIN_PAT:
        required: false
      SERVICENOW_URL:
        required: false
      SERVICENOW_USERNAME:
        required: false
      SERVICENOW_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔐 Authenticate using JSON key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.gcp_region }}-docker.pkg.dev --quiet

      # Short commit SHA used as immutable image tag so Kubernetes always detects a change
      - name: Set image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          REGISTRY="${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project }}/devops-idp"
          IMAGE_NAME="${{ inputs.image_name }}"
          IMAGE_LATEST="$REGISTRY/$IMAGE_NAME:latest"
          IMAGE_SHA="$REGISTRY/$IMAGE_NAME:sha-$SHORT_SHA"

          echo "Building $IMAGE_SHA"
          docker build \
            --build-arg NEXT_PUBLIC_API_GATEWAY_URL=https://devops.internal.company/api \
            --build-arg NEXT_PUBLIC_APP_NAME="DevOps Control Center" \
            -f ${{ inputs.service_path }}/Dockerfile \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            .

          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV

      - name: Push Docker images
        run: |
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"

      # ── Deploy ────────────────────────────────────────────────────────────────

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ inputs.gke_cluster }}
          location: ${{ inputs.gcp_region }}
          project_id: ${{ inputs.gcp_project }}
          # Force the use of the auth plugin
          use_gke_gcloud_auth_plugin: true
          
      - name: Update Helm Dependencies
        run: helm dependency update ./deployment

      # Write all secrets to a temp YAML file so special characters in values
      # (e.g. $, {, }, comma) are handled safely — Helm --set breaks on these.
      - name: Write secrets values file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ADMIN_PAT: ${{ secrets.AZURE_DEVOPS_ADMIN_PAT }}
          SERVICENOW_URL: ${{ secrets.SERVICENOW_URL }}
          SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import yaml, os
          data = {
            "secrets": {
              "postgresPassword":    os.environ.get("POSTGRES_PASSWORD", ""),
              "redisPassword":       os.environ.get("REDIS_PASSWORD", ""),
              "oauthClientId":       os.environ.get("OAUTH_CLIENT_ID", ""),
              "oauthClientSecret":   os.environ.get("OAUTH_CLIENT_SECRET", ""),
              "jwtSecret":           os.environ.get("JWT_SECRET", ""),
              "azureDevopsPat":      os.environ.get("AZURE_DEVOPS_PAT", ""),
              "azureDevopsAdminPat": os.environ.get("AZURE_DEVOPS_ADMIN_PAT", ""),
              "servicenowUrl":       os.environ.get("SERVICENOW_URL", ""),
              "servicenowUsername":  os.environ.get("SERVICENOW_USERNAME", ""),
              "servicenowPassword":  os.environ.get("SERVICENOW_PASSWORD", ""),
            }
          }
          with open("/tmp/secrets-values.yaml", "w") as f:
            yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
          print("Secrets values file written (values redacted from logs)")
          EOF

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install devops-stack ./deployment \
            -n devops-control-center-prod --wait --timeout 10m \
            -f /tmp/secrets-values.yaml \
            --set backend.image.tag="sha-$SHORT_SHA"

