name: Service Template

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      image_name:
        required: true
        type: string
      gcp_project:
        required: true
        type: string
      gcp_region:
        required: true
        type: string
      # GKE cluster details for automatic rollout
      gke_cluster:
        required: false
        type: string
        default: devops-idp-cluster
      k8s_namespace:
        required: false
        type: string
        default: devops-control-center-prod
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔐 Authenticate using JSON key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.gcp_region }}-docker.pkg.dev --quiet

      # Short commit SHA used as immutable image tag so Kubernetes always detects a change
      - name: Set image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          REGISTRY="${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project }}/devops-idp"
          IMAGE_NAME="${{ inputs.image_name }}"
          IMAGE_LATEST="$REGISTRY/$IMAGE_NAME:latest"
          IMAGE_SHA="$REGISTRY/$IMAGE_NAME:sha-$SHORT_SHA"

          echo "Building $IMAGE_SHA"
          docker build \
            --build-arg NEXT_PUBLIC_API_GATEWAY_URL=https://devops.internal.company/api \
            --build-arg NEXT_PUBLIC_APP_NAME="DevOps Control Center" \
            -f ${{ inputs.service_path }}/Dockerfile \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            .

          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV

      - name: Push Docker images
        run: |
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"

      # ── Deploy ────────────────────────────────────────────────────────────────
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # This action installs gke-gcloud-auth-plugin, writes kubeconfig, and
      # sets USE_GKE_GCLOUD_AUTH_PLUGIN automatically — no manual apt needed.
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ inputs.gke_cluster }}
          location: ${{ inputs.gcp_region }}
          project_id: ${{ inputs.gcp_project }}

      # Apply RBAC for the Terraform self-service runner.
      #
      # Why this step exists:
      #   kubectl set image (below) only changes the container image — it never
      #   applies manifest changes such as new ServiceAccounts, Roles, or
      #   serviceAccountName on the Deployment. This step fills that gap so the
      #   cluster always reflects the Git state.
      #
      # What it does:
      #   1. Creates backend-sa in the deployment namespace (idempotent).
      #   2. Applies the devops-terraform-sa SA + Role + RoleBinding from Git
      #      (those live in devops-control-center where Terraform Jobs run).
      #   3. Patches the Deployment to use backend-sa (idempotent merge patch).
      - name: Apply Terraform runner RBAC
        run: |
          NS="${{ inputs.k8s_namespace }}"

          # 1. backend-sa must exist in the deployment namespace so the pod can
          #    use it as its service account.
          kubectl create serviceaccount backend-sa -n "$NS" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Apply devops-terraform-sa SA, Role and RoleBinding into
          #    devops-control-center (the namespace where Terraform Jobs run).
          kubectl apply -f infrastructure/k8s/base/rbac/service-accounts.yaml
          kubectl apply -f infrastructure/k8s/base/rbac/terraform-rbac.yaml

          # 3. Ensure the Deployment spec uses the new backend-sa.
          kubectl patch deployment ${{ inputs.image_name }} -n "$NS" \
            --type=merge \
            -p '{"spec":{"template":{"spec":{"serviceAccountName":"backend-sa"}}}}'

      - name: Update image tag in deployment
        run: |
          REGISTRY="${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project }}/devops-idp"
          kubectl set image deployment/${{ inputs.image_name }} \
            ${{ inputs.image_name }}="$REGISTRY/${{ inputs.image_name }}:sha-$SHORT_SHA" \
            -n ${{ inputs.k8s_namespace }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ inputs.image_name }} \
            -n ${{ inputs.k8s_namespace }} \
            --timeout=300s