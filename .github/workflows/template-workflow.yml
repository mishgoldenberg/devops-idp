name: Service Template

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      image_name:
        required: true
        type: string
      gcp_project:
        required: true
        type: string
      gcp_region:
        required: true
        type: string
      # GKE cluster details for automatic rollout
      gke_cluster:
        required: false
        type: string
        default: devops-idp-cluster
      k8s_namespace:
        required: false
        type: string
        default: devops-control-center-dev
    secrets:
      GCP_SA_KEY:
        required: true
      POSTGRES_PASSWORD:
        required: false
      REDIS_PASSWORD:
        required: false
      JWT_SECRET:
        required: false
      OAUTH_CLIENT_SECRET:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      AZURE_DEVOPS_PAT:
        required: false
      AZURE_DEVOPS_ADMIN_PAT:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔐 Authenticate using JSON key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.gcp_region }}-docker.pkg.dev --quiet

      # Short commit SHA used as immutable image tag so Kubernetes always detects a change
      - name: Set image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          REGISTRY="${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project }}/devops-idp"
          IMAGE_NAME="${{ inputs.image_name }}"
          IMAGE_LATEST="$REGISTRY/$IMAGE_NAME:latest"
          IMAGE_SHA="$REGISTRY/$IMAGE_NAME:sha-$SHORT_SHA"

          echo "Building $IMAGE_SHA"
          docker build \
            --build-arg NEXT_PUBLIC_API_GATEWAY_URL=https://devops.internal.company/api \
            --build-arg NEXT_PUBLIC_APP_NAME="DevOps Control Center" \
            -f ${{ inputs.service_path }}/Dockerfile \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            .

          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV

      - name: Push Docker images
        run: |
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"

      # ── Deploy ────────────────────────────────────────────────────────────────
      
      - name: Inject Secrets into K8s
        run: |
          # Updating the all-scecrets only in case of backend deployment to not override the values
          kubectl create secret generic all-secrets \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            --from-literal=AZURE_DEVOPS_PAT="${{ secrets.AZURE_DEVOPS_PAT }}" \
            --from-literal=AZURE_DEVOPS_ADMIN_PAT="${{ secrets.AZURE_DEVOPS_ADMIN_PAT }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=OAUTH_CLIENT_ID="${{ secrets.OAUTH_CLIENT_ID }}" \
            --from-literal=OAUTH_CLIENT_SECRET="${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -n devops-control-center-prod \
            --dry-run=client -o yaml | kubectl apply -f -
      # Apply RBAC for the Terraform self-service runner.
      #
      # Why this step exists:
      #   kubectl set image (below) only changes the container image — it never
      #   applies manifest changes such as new ServiceAccounts, Roles, or
      #   serviceAccountName on the Deployment. This step fills that gap so the
      #   cluster always reflects the Git state.
      #
      # What it does:
      #   1. Creates backend-sa in the deployment namespace (idempotent).
      #   2. Applies the devops-terraform-sa SA + Role + RoleBinding from Git
      #      (those live in devops-control-center where Terraform Jobs run).
      #   3. Patches the Deployment to use backend-sa (idempotent merge patch).

      # TODO!: refactor to be applied as a service and not the general CI
      - name: Update Helm Dependencies
        run: |
          helm dependency update ./deployment
      # 2. Deploy your Helm chart
      - name: Deploy Helm Chart
        run: |

          helm upgrade --install devops-stack ./deployment \
          -n devops-control-center-prod --wait --timeout 10m \
          --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
          --set secrets.redisPassword="${{ secrets.REDIS_PASSWORD }}" \
          --set secrets.oauthClientId="${{ secrets.OAUTH_CLIENT_ID }}" \
          --set secrets.oauthClientSecret="${{ secrets.OAUTH_CLIENT_SECRET }}" \
          --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
          --set secrets.azureDevopsPat="${{ secrets.AZURE_DEVOPS_PAT }}" \
          --set secrets.azureDevopsAdminPat="${{ secrets.AZURE_DEVOPS_ADMIN_PAT }}" \

