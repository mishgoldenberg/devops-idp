name: Helm Chart Frontend CI

on:
  push:
    paths:
      - "deployment/charts/frontend/**"

jobs:
  frontend:
    uses: ./.github/workflows/helmchart-template-workflow.yml
    with:
      service_path: deployment/charts/frontend
      helm_name: frontend
      gcp_project: devops-idp-489012
      gcp_region: europe-west1
      repository_name: devops-idp-helm-charts
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}